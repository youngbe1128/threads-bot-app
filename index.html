e><tr><th>키워드<\/th><th>점수<\/th><th>사용<\/th><th>근거<\/th><\/tr>{kw_html}<\/table><\/section>\n<section><h2>최근 게시물<\/h2><table><tr><th>시간<\/th><th>글<\/th><th>조회<\/th><th>좋아요<\/th><th>댓글<\/th><th>주문<\/th><th>보상<\/th><th>전략<\/th><\/tr>{post_html}<\/table><\/section>\n<\/body><\/html>\"\"\"\n    out = ROOT / \"data\" / \"report.html\"\n    out.write_text(page, encoding=\"utf-8\")\n    _markdown(engine, tot, rev, arms, kws, pb, posts)\n    _dashboard_json(engine, tot, rev, arms, kws, pb, posts)\n    return out\n\n\ndef _dashboard_json(engine, tot, rev, arms, kws, pb, posts):\n    \"\"\"관리앱(UI)이 읽는 데이터: data/dashboard.json\"\"\"\n    from zoneinfo import ZoneInfo\n    from .config import Config\n    from .notify import recent\n    tz = ZoneInfo(Config.TIMEZONE)\n    db = engine.db\n    today = dt.datetime.now(tz).date()\n    days = []\n    for i in range(13, -1, -1):\n        d = today - dt.timedelta(days=i)\n        a = dt.datetime.combine(d, dt.time(0), tz).timestamp()\n        r = db.one(\"\"\"SELECT COUNT(*) n, SUM(views) v, SUM(likes) l, SUM(replies) c FROM posts\n                      WHERE post_type!='history' AND posted_at>=? AND posted_at<?\"\"\", (a, a + 86400))\n        days.append({\"date\": d.strftime(\"%m/%d\"), \"posts\": r[\"n\"] or 0, \"views\": r[\"v\"] or 0,\n                     \"likes\": r[\"l\"] or 0, \"replies\": r[\"c\"] or 0})\n    plan = db.kv_get(f\"plan_{today:%Y%m%d}\") or []\n    replies_24h = db.one(\"SELECT COUNT(*) c FROM replied WHERE at>? AND reply IS NOT NULL\",\n                         (dt.datetime.now().timestamp() - 86400,))[\"c\"]\n    data = {\n        \"generated_at\": dt.datetime.now(tz).strftime(\"%Y-%m-%d %H:%M\"),\n        \"mode\": \"simulation\" if engine.th.sim else \"live\",\n        \"coupang_api\": engine.cp.live,\n        \"kpi\": {\"posts\": tot[\"n\"] or 0, \"views\": tot[\"v\"] or 0, \"likes\": tot[\"l\"] or 0, \"replies\": tot[\"r\"] or 0,\n                \"orders_30d\": rev.get(\"orders\", 0), \"commission_30d\": rev.get(\"commission\", 0),\n                \"replies_sent_24h\": replies_24h, \"available_products\": engine.ex.available_count()},\n        \"days\": days,\n        \"today_plan\": [{\"time\": dt.datetime.fromtimestamp(p[\"ts\"], tz).strftime(\"%H:%M\"), \"done\": p[\"done\"]} for p in plan],\n        \"arms\": [{\"dimension\": a[\"dimension\"], \"arm\": a[\"arm\"], \"description\": a[\"description\"], \"mean\": round(a[\"mean\"], 3),\n                  \"pulls\": a[\"pulls\"], \"active\": bool(a[\"active\"]), \"ai_made\": a[\"origin\"] == \"llm\"} for a in arms],\n        \"posts\": [{\"time\": dt.datetime.fromtimestamp(p[\"posted_at\"], tz).strftime(\"%m/%d %H:%M\"), \"type\": p[\"post_type\"],\n                   \"text\": (p[\"text\"] or \"\")[:400], \"permalink\": p[\"permalink\"], \"views\": p[\"views\"], \"likes\": p[\"likes\"],\n                   \"replies\": p[\"replies\"], \"shares\": (p[\"shares\"] or 0) + (p[\"reposts\"] or 0), \"orders\": p[\"orders\"],\n                   \"reward\": None if p[\"reward\"] is None else round(p[\"reward\"], 2),\n                   \"arms\": json.loads(p[\"arms\"] or \"{}\")} for p in posts[:40]],\n        \"keywords\": [{\"keyword\": k[\"keyword\"], \"score\": round(k[\"m\"], 2), \"uses\": k[\"uses\"], \"reason\": k[\"reason\"]} for k in kws[:20]],\n        \"suggestions\": engine.ex.suggestions(10),\n        \"playbook\": pb,\n        \"alerts\": recent(4000),\n    }\n    (ROOT / \"data\" / \"dashboard.json\").write_text(json.dumps(data, ensure_ascii=False), encoding=\"utf-8\")\n\n\ndef _markdown(engine, tot, rev, arms, kws, pb, posts):\n    \"\"\"깃허브(모바일 포함)에서 바로 보이는 리포트: data/리포트.md\"\"\"\n    from .notify import recent\n    c = lambda s: str(s if s is not None else \"\").replace(\"|\", \"/\").replace(\"\\n\", \" \")\n    lines = [f\"# 쓰레드 자동화 리포트\", f\"_{dt.datetime.now():%Y-%m-%d %H:%M} 갱신 · {'시뮬레이션' if engine.th.sim else '실제'} 모드_\", \"\",\n             f\"**게시 {tot['n'] or 0}개 · 조회 {tot['v'] or 0:,} · 좋아요 {tot['l'] or 0:,} · 댓글 {tot['r'] or 0:,}\"\n             f\" · 30일 주문 {rev.get('orders', 0)}건 · 수수료 {rev.get('commission', 0):,.0f}원**\", \"\",\n             \"## 현재 플레이북\", \"\", pb, \"\",\n             \"## 전략별 학습 현황\", \"\", \"| 차원 | 선택지 | 기대성과 | 시도 |\", \"|---|---|---|---|\"]\n    lines += [f\"| {a['dimension']} | {c(a['arm'])}{' (AI신규)' if a['origin']=='llm' else ''}{' (은퇴)' if not a['active'] else ''}\"\n              f\" | {a['mean']:.2f} | {a['pulls']} |\" for a in arms]\n    lines += [\"\", \"## 최근 게시물\", \"\", \"| 시간 | 종류 | 글 | 조회 | 좋아요 | 댓글 | 보상 |\", \"|---|---|---|---|---|---|---|\"]\n    lines += [f\"| {dt.datetime.fromtimestamp(p['posted_at']):%m/%d %H:%M} | {p['post_type']} | \"\n              f\"[{c((p['text'] or '')[:35])}]({p['permalink'] or ''}) | {p['views']} | {p['likes']} | {p['replies']} | \"\n              f\"{'' if p['reward'] is None else round(p['reward'], 2)} |\" for p in posts[:25]]\n    lines += [\"\", \"## 키워드 성과\", \"\", \"| 키워드 | 점수 | 사용 |\", \"|---|---|---|\"]\n    lines += [f\"| {c(k['keyword'])} | {k['m']:.2f} | {k['uses']} |\" for k in kws[:15]]\n    lines += [\"\", \"## 최근 알림\", \"\", \"```\", recent(2000), \"```\"]\n    (ROOT / \"data\" / \"리포트.md\").write_text(\"\\n\".join(lines), encoding=\"utf-8\")\n", "bot/strategy.py": "\"\"\"전략 선택기: 톰슨 샘플링(Multi-armed bandit).\n\n각 '차원'(후킹 방식, 형식, 말투, 링크 위치, 시간대)마다 여러 선택지(arm)가 있고,\n게시물 성과(0~1 보상)로 Beta 분포를 갱신한다. 잘 되는 전략은 더 자주, 하지만 탐색도 계속한다.\nLLM 회고 단계에서 새로운 arm(예: 새로운 후킹 스타일)을 제안해 추가할 수도 있다.\n\"\"\"\nimport random\nimport time\n\nSEED_ARMS = {\n    \"hook\": {\n        \"공감상황형\": \"일상 속 불편한 상황을 먼저 꺼내 공감을 얻고 해결책으로 상품을 소개\",\n        \"질문형\": \"독자에게 질문을 던져 댓글을 유도 (예: '다들 ○○ 어떻게 해요?')\",\n        \"숫자리스트형\": \"'○○할 때 알아두면 좋은 3가지'처럼 숫자로 정리\",\n        \"문제해결형\": \"구체적 문제 → 원인 → 이 상품이 해결하는 방식\",\n        \"비교형\": \"비슷한 상품군과 비교해서 고르는 기준을 알려줌\",\n        \"가격포인트형\": \"가격대/할인 등 가격 정보를 먼저 제시 (정확한 수치만)\",\n    },\n    \"format\": {\n        \"short_text\": \"3~5줄 짧은 텍스트\",\n        \"image_post\": \"상품 이미지 + 짧은 텍스트\",\n        \"thread_chain\": \"본문 + 이어지는 설명 1개(스레드형)로 체류시간 확보\",\n    },\n    \"tone\": {\n        \"친구반말\": \"친구에게 말하듯 편한 반말\",\n        \"정중존댓말\": \"부드러운 존댓말\",\n        \"정보요약체\": \"군더더기 없는 요약/개조식\",\n    },\n    \"link_placement\": {\n        \"first_reply\": \"본문엔 링크 없이, 첫 댓글에 링크\",\n        \"body\": \"본문에 링크 포함\",\n    },\n    # 광고 없는 일반 글의 유형 (팔로워·신뢰 확보용)\n    \"content_type\": {\n        \"생활팁\": \"니치 관련 바로 써먹는 생활 팁 1~3개\",\n        \"공감관찰\": \"많은 사람이 겪는 일상 상황을 관찰자 시점으로 묘사해 공감 유도 (지어낸 개인사 금지)\",\n        \"질문토론\": \"독자 의견을 묻는 가벼운 질문/양자택일로 댓글 유도\",\n        \"고르는기준\": \"특정 물건 종류를 살 때 확인할 기준 정리 (특정 상품 홍보 없이)\",\n        \"소소한의견\": \"니치 관련 짧은 생각/취향 한 마디, 가볍게\",\n    },\n    \"time_slot\": {\n        \"07-09\": \"출근길\", \"11-13\": \"점심\", \"18-20\": \"퇴근길\", \"21-23\": \"자기 전\",\n    },\n}\n\n# 사전지식(prior): 최근 쓰레드 운영자들 사이에서 '본문 링크는 도달이 떨어진다'는 관찰이 많아 댓글 링크에 약한 가중치\nPRIORS = {(\"link_placement\", \"first_reply\"): (2.0, 1.0), (\"format\", \"image_post\"): (1.5, 1.0)}\n\nMAX_ACTIVE_PER_DIM = 9\n\n\nclass Strategy:\n    def __init__(self, db):\n        self.db = db\n        if not db.one(\"SELECT 1 FROM arms LIMIT 1\"):\n            for dim, arms in SEED_ARMS.items():\n                for arm, desc in arms.items():\n                    a, b = PRIORS.get((dim, arm), (1.0, 1.0))\n                    db.x(\"INSERT INTO arms(dimension,arm,description,alpha,beta,created_at) VALUES(?,?,?,?,?,?)\",\n                         (dim, arm, desc, a, b, time.time()))\n        self.ensure_seed()\n\n    def arms(self, dim, active_only=True):\n        sql = \"SELECT * FROM arms WHERE dimension=?\" + (\" AND active=1\" if active_only else \"\")\n        return self.db.q(sql, (dim,))\n\n    def sample(self, dim, exclude=()):\n        best, best_v = None, -1\n        for a in self.arms(dim):\n            if a[\"arm\"] in exclude:\n                continue\n            v = random.betavariate(max(a[\"alpha\"], 0.01), max(a[\"beta\"], 0.01))\n            if v > best_v:\n                best, best_v = a, v\n        return best\n\n    def ensure_seed(self):\n        \"\"\"새로 추가된 차원(업데이트)이 기존 DB에 없으면 채워넣음\"\"\"\n        for dim, arms in SEED_ARMS.items():\n            if not self.db.one(\"SELECT 1 FROM arms WHERE dimension=?\", (dim,)):\n                for arm, desc in arms.items():\n                    self.db.x(\"INSERT INTO arms(dimension,arm,description,created_at) VALUES(?,?,?,?)\",\n                              (dim, arm, desc, time.time()))\n\n    def choose_content(self, time_slot=None):\n        return {\"content_type\": self.sample(\"content_type\")[\"arm\"], \"tone\": self.sample(\"tone\")[\"arm\"],\n                \"time_slot\": time_slot or self.sample(\"time_slot\")[\"arm\"]}\n\n    def choose(self, time_slot=None):\n        chosen = {}\n        for dim in (\"hook\", \"format\", \"tone\", \"link_placement\"):\n            a = self.sample(dim)\n            chosen[dim] = a[\"arm\"]\n        chosen[\"time_slot\"] = time_slot or self.sample(\"time_slot\")[\"arm\"]\n        # 이미지 게시물엔 link_attachment를 쓸 수 없지만 본문 URL은 가능 → 그대로 둔다\n        return chosen\n\n    def descriptions(self, chosen):\n        out = {}\n        for dim, arm in chosen.items():\n            r = self.db.one(\"SELECT description FROM arms WHERE dimension=? AND arm=?\", (dim, arm))\n            out[dim] = f\"{arm} — {r['description'] if r else ''}\"\n        return out\n\n    def update(self, arms, reward):\n        for dim, arm in arms.items():\n            self.db.x(\"UPDATE arms SET alpha=alpha+?, beta=beta+?, pulls=pulls+1 WHERE dimension=? AND arm=?\",\n                      (reward, 1 - reward, dim, arm))\n\n    def decay(self, factor=0.97):\n        \"\"\"오래된 학습을 조금씩 잊어 트렌드 변화에 적응 (비정상성 대응)\"\"\"\n        self.db.x(\"UPDATE arms SET alpha=1+(alpha-1)*?, beta=1+(beta-1)*?\", (factor, factor))\n\n    def add_arm(self, dim, arm, desc):\n        if dim not in (\"hook\", \"format\", \"tone\", \"content_type\"):\n            return False\n        if self.db.one(\"SELECT 1 FROM arms WHERE dimension=? AND arm=?\", (dim, arm)):\n            return False\n        active = self.arms(dim)\n        if len(active) >= MAX_ACTIVE_PER_DIM:\n            # 가장 성과 낮고 충분히 시도된 arm 은퇴\n            worst = sorted([a for a in active if a[\"pulls\"] >= 5],\n                           key=lambda a: a[\"alpha\"] / (a[\"alpha\"] + a[\"beta\"]))\n            if not worst:\n                return False\n            self.db.x(\"UPDATE arms SET active=0 WHERE dimension=? AND arm=?\", (dim, worst[0][\"arm\"]))\n        # 신규 arm은 약간 낙관적으로 시작해 탐색 기회를 준다\n        self.db.x(\"INSERT INTO arms(dimension,arm,description,alpha,beta,origin,created_at) VALUES(?,?,?,?,?,?,?)\",\n                  (dim, arm, desc, 1.5, 1.0, \"llm\", time.time()))\n        return True\n\n    def table(self):\n        rows = self.db.q(\"SELECT * FROM arms ORDER BY dimension, alpha/(alpha+beta) DESC\")\n        for r in rows:\n            r[\"mean\"] = r[\"alpha\"] / (r[\"alpha\"] + r[\"beta\"])\n        return rows\n", "bot/threads.py": "\"\"\"Meta Threads 공식 API 클라이언트 (graph.threads.net) + 시뮬레이션 모드\"\"\"\nimport hashlib\nimport random\nimport time\n\nimport requests\n\nfrom .config import Config\n\nAPI = \"https://graph.threads.net/v1.0\"\n\n\nclass ThreadsError(Exception):\n    pass\n\n\nclass Threads:\n    def __init__(self, db):\n        self.db = db\n        self.sim = Config.simulate()\n        self.user_id = Config.THREADS_USER_ID or \"me\"\n        env_tok = Config.THREADS_ACCESS_TOKEN or \"\"\n        src = hashlib.sha256(env_tok.encode()).hexdigest()[:16]\n        # 관리앱에서 토큰을 새로 넣으면(환경값 변경) 예전에 저장해 둔 연장 토큰은 버림\n        if db.kv_get(\"threads_token_src\") != src:\n            db.kv_set(\"threads_token_src\", src)\n            db.kv_set(\"threads_token\", None)\n            db.kv_set(\"token_exchange_tried\", False)\n        self.token = db.kv_get(\"threads_token\") or env_tok\n        if not self.sim:\n            self._ensure_long_lived()\n\n    def _ensure_long_lived(self):\n        \"\"\"1시간짜리 단기 토큰을 넣어도 앱 시크릿이 있으면 60일 토큰으로 자동 교환\"\"\"\n        if self.db.kv_get(\"token_exchange_tried\") or not Config.THREADS_APP_SECRET:\n            return\n        self.db.kv_set(\"token_exchange_tried\", True)\n        try:\n            j = requests.get(\"https://graph.threads.net/access_token\",\n                             params={\"grant_type\": \"th_exchange_token\", \"client_secret\": Config.THREADS_APP_SECRET,\n                                     \"access_token\": self.token}, timeout=30).json()\n        except Exception:\n            return\n        if j.get(\"access_token\"):\n            self.token = j[\"access_token\"]\n            self.db.kv_set(\"threads_token\", self.token)\n            self.db.log(\"단기 토큰을 60일 토큰으로 자동 교환했어요\")\n\n    def _call(self, method, path, params=None, api=\"threads\"):\n        params = dict(params or {})\n        params[\"access_token\"] = self.token\n        self.db.record_call(api)\n        r = requests.request(method, f\"{API}/{path.lstrip('/')}\", params=params if method == \"GET\" else None,\n                             data=params if method != \"GET\" else None, timeout=30)\n        try:\n            j = r.json()\n        except ValueError:\n            raise ThreadsError(f\"{path} 응답 파싱 실패 {r.status_code}\")\n        if r.status_code >= 400 or \"error\" in j:\n            raise ThreadsError(f\"{path} 오류 {r.status_code}: {j.get('error', j)}\")\n        return j\n\n    # ---------- 토큰 ----------\n    def refresh_token(self):\n        \"\"\"장기 토큰(60일)을 연장. 발급 24시간 후부터 가능. 주 1회 호출.\"\"\"\n        if self.sim:\n            return\n        r = requests.get(\"https://graph.threads.net/refresh_access_token\",\n                         params={\"grant_type\": \"th_refresh_token\", \"access_token\": self.token}, timeout=30)\n        j = r.json()\n        if \"access_token\" in j:\n            self.token = j[\"access_token\"]\n            self.db.kv_set(\"threads_token\", self.token)\n            self.db.log(f\"쓰레드 토큰 갱신 완료 (만료까지 {int(j.get('expires_in', 0))//86400}일)\")\n        else:\n            self.db.log(f\"토큰 갱신 실패: {j}\", \"WARN\")\n\n    def me(self):\n        if self.sim:\n            return {\"id\": \"sim\", \"username\": \"simulation\"}\n        j = self._call(\"GET\", \"me\", {\"fields\": \"id,username\"})\n        self.user_id = j[\"id\"]\n        return j\n\n    def publishing_quota(self):\n        if self.sim:\n            return {\"quota_usage\": 0, \"config\": {\"quota_total\": 250}}\n        j = self._call(\"GET\", f\"{self.user_id}/threads_publishing_limit\",\n                       {\"fields\": \"quota_usage,config,reply_quota_usage,reply_config\"})\n        return (j.get(\"data\") or [{}])[0]\n\n    # ---------- 게시 ----------\n    def _publish(self, params):\n        if self.sim:\n            fake = f\"sim{int(time.time()*1000)}{random.randint(100,999)}\"\n            return fake\n        c = self._call(\"POST\", f\"{self.user_id}/threads\", params, api=\"threads_post\")\n        cid = c[\"id\"]\n        # 이미지/동영상은 서버 처리 대기 필요\n        if params.get(\"media_type\") in (\"IMAGE\", \"VIDEO\", \"CAROUSEL\"):\n            for _ in range(20):\n                s = self._call(\"GET\", cid, {\"fields\": \"status,error_message\"})\n                if s.get(\"status\") == \"FINISHED\":\n                    break\n                if s.get(\"status\") == \"ERROR\":\n                    raise ThreadsError(f\"미디어 처리 실패: {s.get('error_message')}\")\n                time.sleep(3)\n        else:\n            time.sleep(2)\n        p = self._call(\"POST\", f\"{self.user_id}/threads_publish\", {\"creation_id\": cid}, api=\"threads_post\")\n        return p[\"id\"]\n\n    def post(self, text, image_url=None, reply_to=None, topic_tag=None, link=None):\n        params = {\"text\": text[:500]}\n        if image_url:\n            params.update(media_type=\"IMAGE\", image_url=image_url)\n        else:\n            params[\"media_type\"] = \"TEXT\"\n            if link:\n                params[\"link_attachment\"] = link  # 텍스트 게시물 전용 링크 미리보기\n        if reply_to:\n            params[\"reply_to_id\"] = reply_to\n        if topic_tag:\n            params[\"topic_tag\"] = topic_tag.replace(\"#\", \"\").replace(\".\", \"\").replace(\"&\", \"\")[:50]\n        return self._publish(params)\n\n    def permalink(self, media_id):\n        if self.sim:\n            return f\"https://www.threads.com/simulated/{media_id}\"\n        try:\n            return self._call(\"GET\", media_id, {\"fields\": \"permalink\"}).get(\"permalink\")\n        except ThreadsError:\n            return None\n\n    # ---------- 성과 ----------\n    def insights(self, media_id, age_hours=24, arms=None):\n        metrics = [\"views\", \"likes\", \"replies\", \"reposts\", \"quotes\", \"shares\"]\n        if self.sim:\n            return self._simulated_metrics(age_hours, arms or {})\n        j = self._call(\"GET\", f\"{media_id}/insights\", {\"metric\": \",\".join(metrics)}, api=\"threads_insights\")\n        out = {m: 0 for m in metrics}\n        for d in j.get(\"data\", []):\n            vals = d.get(\"values\") or [{}]\n            out[d[\"name\"]] = int((d.get(\"total_value\") or vals[0]).get(\"value\", 0) or 0)\n        return out\n\n    def account_insights(self):\n        if self.sim:\n            return {\"followers_count\": 0}\n        try:\n            j = self._call(\"GET\", f\"{self.user_id}/threads_insights\",\n                           {\"metric\": \"views,likes,replies,reposts,quotes,followers_count\"})\n            out = {}\n            for d in j.get(\"data\", []):\n                v = (d.get(\"total_value\") or (d.get(\"values\") or [{}])[-1]).get(\"value\", 0)\n                out[d[\"name\"]] = v\n            return out\n        except ThreadsError as e:\n            self.db.log(f\"계정 인사이트 실패: {e}\", \"WARN\")\n            return {}\n\n    def link_clicks(self, since_ts):\n        \"\"\"계정 링크 클릭(링크별). Meta가 제공하지 않으면 빈 dict — 기능이 조용히 꺼짐.\"\"\"\n        if self.sim or self.db.kv_get(\"clicks_unsupported\"):\n            return {}\n        try:\n            j = self._call(\"GET\", f\"{self.user_id}/threads_insights\",\n                           {\"metric\": \"clicks\", \"since\": int(since_ts), \"until\": int(time.time())})\n        except ThreadsError as e:\n            self.db.log(f\"링크 클릭 지표 미지원 → 비활성화: {e}\", \"WARN\")\n            self.db.kv_set(\"clicks_unsupported\", True)\n            return {}\n        out = {}\n        for d in j.get(\"data\", []):\n            for v in d.get(\"link_total_values\", []) or []:\n                out[v.get(\"link_url\")] = out.get(v.get(\"link_url\"), 0) + int(v.get(\"value\", 0))\n        return out\n\n    # ---------- 댓글 ----------\n    def get_replies(self, media_id):\n        if self.sim:\n            return []\n        try:\n            j = self._call(\"GET\", f\"{media_id}/replies\",\n                           {\"fields\": \"id,text,username,timestamp,hide_status\", \"reverse\": \"false\"})\n            return j.get(\"data\", [])\n        except ThreadsError as e:\n            self.db.log(f\"댓글 조회 실패: {e}\", \"WARN\")\n            return []\n\n    # ---------- 기존 글 ----------\n    def my_threads(self, max_items=100):\n        if self.sim:\n            return []\n        out, after = [], None\n        while len(out) < max_items:\n            params = {\"fields\": \"id,text,timestamp,permalink,media_type,is_quote_post\", \"limit\": 50}\n            if after:\n                params[\"after\"] = after\n            j = self._call(\"GET\", f\"{self.user_id}/threads\", params)\n            out += j.get(\"data\", [])\n            after = (j.get(\"paging\") or {}).get(\"cursors\", {}).get(\"after\")\n            if not after or not j.get(\"data\"):\n                break\n        return out[:max_items]\n\n    # ---------- 탐색 ----------\n    def keyword_search(self, q, search_type=\"TOP\", limit=25, since_days=7):\n        if self.sim or not Config.THREADS_KEYWORD_SEARCH:\n            return []\n        if self.db.calls_since(\"threads_search\", 86400) >= Config.THREADS_SEARCH_PER_DAY:\n            return []\n        params = {\"q\": q, \"search_type\": search_type, \"limit\": limit,\n                  \"fields\": \"id,text,media_type,permalink,timestamp,username,has_replies\",\n                  \"since\": int(time.time() - since_days * 86400)}\n        try:\n            j = self._call(\"GET\", \"keyword_search\", params, api=\"threads_search\")\n            return j.get(\"data\", [])\n        except ThreadsError as e:\n            self.db.log(f\"키워드 검색 실패({q}): {e}\", \"WARN\")\n            return []\n\n    # ---------- 시뮬레이션 지표 (테스트용) ----------\n    @staticmethod\n    def _simulated_metrics(age_hours, arms):\n        \"\"\"전략별로 '숨은 정답'을 두어 학습이 실제로 수렴하는지 확인할 수 있게 한다.\"\"\"\n        base = 300\n        bonus = {\"hook:공감상황형\": 1.8, \"hook:문제해결형\": 1.5, \"format:image_post\": 1.4,\n                 \"link_placement:first_reply\": 1.3, \"time_slot:21-23\": 1.5, \"tone:친구반말\": 1.2}\n        mult = 1.0\n        for dim, arm in arms.items():\n            mult *= bonus.get(f\"{dim}:{arm}\", 1.0)\n        views = int(random.lognormvariate(0, 0.5) * base * mult * min(1, age_hours / 24 + 0.2))\n        likes = int(views * random.uniform(0.01, 0.04) * mult)\n        return {\"views\": views, \"likes\": likes, \"replies\": int(likes * random.uniform(0.1, 0.4)),\n                \"reposts\": int(likes * random.uniform(0, 0.1)), \"quotes\": 0,\n                \"shares\": int(likes * random.uniform(0, 0.15))}\n", "bot/writer.py": "\"\"\"게시글 작성기: 선택된 전략(arm) + 플레이북 + 상품 정보로 쓰레드 글 생성, 규정 검사\"\"\"\nimport re\n\nfrom . import llm\nfrom .config import Config\n\n# 허위·과장 방지: 실제로 써보지 않은 상품의 '사용 후기'를 지어내면 표시광고법 위반 소지 + 계정 신뢰도 하락\nBANNED = [\n    r\"내돈내산\", r\"직접\\s*(써|사용|먹어)\", r\"써\\s*보니\", r\"사용해\\s*보니\", r\"먹어\\s*보니\", r\"제가\\s*써\",\n    r\"(한\\s*달|일주일|몇\\s*달)\\s*(째|동안)\\s*(쓰|사용)\", r\"품절\\s*임박\", r\"최저가\\s*보장\", r\"마지막\\s*기회\",\n    r\"완치\", r\"치료\", r\"효능\", r\"100%\\s*(효과|만족)\",\n]\n\nSYSTEM = \"\"\"너는 한국 쓰레드(Threads)에서 활동하는 생활 큐레이터 계정의 카피라이터다.\n페르소나: {persona}\n\n반드시 지킬 원칙:\n1. 직접 사용해본 척하지 않는다. '써보니', '내돈내산', '한 달째 쓰는 중' 같은 가짜 체험담 금지.\n   대신 '이런 상황이면 이런 기능이 유용하다', '고를 때 볼 포인트' 같은 정보/큐레이션 관점으로 쓴다.\n2. 상품 정보(가격 등)는 주어진 값만 사용. 없는 스펙·리뷰 수·평점·효능을 지어내지 않는다.\n3. 품절임박/마지막기회 같은 가짜 긴급성 금지. 의학적 효능 주장 금지.\n4. 쓰레드는 대화형 플랫폼이다. 광고 전단지처럼 쓰지 말고 사람 말투로, 첫 줄에서 스크롤을 멈추게 한다.\n5. 해시태그 남발 금지(본문엔 0개). 이모지는 0~2개.\n6. 본문은 공백 포함 350자 이내.\"\"\"\n\n\ndef _fmt_price(p):\n    return f\"{p:,}원\" if p else \"가격은 링크에서 확인\"\n\n\ndef violations(text, product):\n    v = [b for b in BANNED if re.search(b, text)]\n    for m in re.findall(r\"(\\d[\\d,]{2,})\\s*원\", text):\n        n = int(m.replace(\",\", \"\"))\n        if product.get(\"price\") and abs(n - product[\"price\"]) > product[\"price\"] * 0.05 and n > 1000:\n            v.append(f\"가격불일치:{m}\")\n    return v\n\n\ndef generate(product, arms, arm_desc, playbook, recent_texts):\n    user = f\"\"\"[상품]\n- 상품명: {product['name']}\n- 가격: {_fmt_price(product.get('price'))} (작성 시점 기준, 변동 가능)\n- 카테고리: {product.get('category') or '-'}\n- 로켓배송: {'예' if product.get('is_rocket') else '정보 없음'}\n- 발견 경로: {product.get('source')} / 검색키워드: {product.get('keyword') or '-'}\n\n[이번 글의 전략 — 이 조합을 테스트 중이니 충실히 따를 것]\n- 후킹: {arm_desc['hook']}\n- 형식: {arm_desc['format']}\n- 말투: {arm_desc['tone']}\n- 링크 위치: {arm_desc['link_placement']}\n\n[지금까지 데이터로 학습한 플레이북 — 우선 반영]\n{playbook or '(아직 데이터 없음. 기본 원칙대로)'}\n\n[최근 올린 글 — 표현·첫 문장 반복 금지]\n{chr(10).join('- ' + t[:80].replace(chr(10), ' ') for t in recent_texts) or '(없음)'}\n\n출력 JSON:\n{{\"main\": \"본문 (링크·광고문구 넣지 말 것, 시스템이 붙임)\",\n  \"chain\": \"형식이 thread_chain일 때만 이어지는 두번째 글(250자 이내), 아니면 빈 문자열\",\n  \"reply\": \"링크 댓글에 들어갈 한두 줄 안내 문구 (링크는 시스템이 붙임)\",\n  \"topic_tag\": \"쓰레드 주제 태그 1개 (띄어쓰기 없이 짧게, 예: 자취꿀팁)\"}}\"\"\"\n    sys = SYSTEM.format(persona=Config.PERSONA)\n    for attempt in range(2):\n        out = llm.ask_json(sys, user)\n        if out is None:\n            return template(product, arms)\n        if not isinstance(out, dict) or not out.get(\"main\"):\n            continue\n        allt = \" \".join([out.get(\"main\", \"\"), out.get(\"chain\", \"\"), out.get(\"reply\", \"\")])\n        v = violations(allt, product)\n        if not v:\n            return out\n        user += f\"\\n\\n[직전 출력이 규칙 위반: {v}. 해당 표현을 빼고 다시 작성]\"\n    return template(product, arms)\n\n\ndef template(product, arms):\n    \"\"\"LLM 키가 없을 때의 규칙 기반 문구 (테스트/비상용)\"\"\"\n    name, price = product[\"name\"], _fmt_price(product.get(\"price\"))\n    banmal = arms.get(\"tone\") == \"친구반말\"\n    hooks = {\n        \"공감상황형\": f\"{'이거 은근 스트레스지 않아?' if banmal else '이런 상황, 은근 스트레스죠?'}\\n매번 신경 쓰이던 거 {name} 하나로 정리되는 경우가 많더라{'' if banmal else '고요'}.\",\n        \"질문형\": f\"{'다들' if banmal else '여러분은'} 이거 어떻게 해결{'해?' if banmal else '하세요?'}\\n요즘 {name} 찾는 사람이 많아서 정리해봤{'어' if banmal else '어요'}.\",\n        \"숫자리스트형\": f\"{name} 고를 때 볼 3가지\\n1. 크기·용량\\n2. 세척/관리 편의성\\n3. 가격 대비 구성\",\n        \"문제해결형\": f\"{'자꾸' if banmal else '계속'} 같은 문제로 불편했다면\\n{name} 같은 해결템이 있{'어' if banmal else '어요'}.\",\n        \"비교형\": f\"{name}, 비슷한 거 많은데 고르는 기준은 딱 하나{'야' if banmal else '예요'}.\\n내 생활패턴에 맞는지.\",\n        \"가격포인트형\": f\"{name} 현재 {price} (작성 시점 기준)\\n이 가격대면 한번 볼 만{'해' if banmal else '해요'}.\",\n    }\n    return {\"main\": hooks.get(arms.get(\"hook\"), hooks[\"문제해결형\"]),\n            \"chain\": f\"참고로 가격은 {price} 기준이고 변동될 수 있{'어' if banmal else '어요'}.\" if arms.get(\"format\") == \"thread_chain\" else \"\",\n            \"reply\": \"궁금한 분들 위해 링크 남겨둘게요\" if not banmal else \"궁금한 사람 링크 여기\",\n            \"topic_tag\": (product.get(\"category\") or \"생활꿀템\").split(\"/\")[0]}\n\n\ndef compose(draft, link, arms):\n    \"\"\"최종 게시 단위(본문, 이어쓰기, 링크댓글)로 조립. 광고 표기는 항상 포함.\"\"\"\n    main = draft[\"main\"].strip()\n    posts = []\n    if arms[\"link_placement\"] == \"body\":\n        main = f\"{main}\\n\\n{link}\\n\\n{Config.DISCLOSURE}\"\n        posts.append({\"text\": main[:500], \"role\": \"main\", \"link\": link})\n        if draft.get(\"chain\"):\n            posts.append({\"text\": draft[\"chain\"][:500], \"role\": \"chain\"})\n    else:\n        posts.append({\"text\": f\"{main}\\n\\n{Config.SHORT_DISCLOSURE}\"[:500], \"role\": \"main\"})\n        if draft.get(\"chain\"):\n            posts.append({\"text\": draft[\"chain\"][:500], \"role\": \"chain\"})\n        reply = f\"{draft.get('reply', '').strip()}\\n{link}\\n\\n{Config.DISCLOSURE}\"\n        posts.append({\"text\": reply[:500], \"role\": \"link_reply\", \"link\": link})\n    return posts\n\n\n# ---------------- 광고 없는 일반 글 ----------------\nCONTENT_SYSTEM = \"\"\"너는 한국 쓰레드(Threads) 생활 큐레이터 계정의 운영자다.\n페르소나: {persona}\n계정 주제: {niche}\n\n이번 글은 광고가 아니다. 목적은 팔로워가 '이 계정 유용하다/재밌다'고 느끼게 하는 것.\n원칙:\n1. 상품명·브랜드·링크·구매 유도 금지.\n2. 실제로 겪은 척하는 구체적 개인사(가족·연애·사건)를 지어내지 않는다. 관찰, 팁, 질문, 의견 형태로.\n3. 쓰레드 말투: 짧은 문장, 첫 줄에서 멈추게. 해시태그 0개, 이모지 0~2개. 공백 포함 300자 이내.\n4. 의학·법률·투자 조언 금지.\"\"\"\n\n\ndef generate_content(arms, arm_desc, playbook, recent_texts, trend_samples):\n    user = f\"\"\"[이번 글 전략]\n- 유형: {arm_desc['content_type']}\n- 말투: {arm_desc['tone']}\n\n[학습된 플레이북]\n{playbook or '(아직 없음)'}\n\n[요즘 쓰레드에서 사람들이 말하는 것 (소재 참고, 문장 복제 금지)]\n{chr(10).join('- ' + t[:120].replace(chr(10), ' ') for t in trend_samples) or '(없음)'}\n\n[최근 올린 글 — 소재·첫 문장 반복 금지]\n{chr(10).join('- ' + t[:80].replace(chr(10), ' ') for t in recent_texts) or '(없음)'}\n\n출력 JSON: {{\"main\": \"본문\", \"topic_tag\": \"주제 태그 1개(띄어쓰기 없이)\"}}\"\"\"\n    sys = CONTENT_SYSTEM.format(persona=Config.PERSONA, niche=Config.NICHE)\n    for _ in range(2):\n        out = llm.ask_json(sys, user, temperature=0.9)\n        if out is None:\n            return content_template(arms)\n        if not isinstance(out, dict) or not out.get(\"main\"):\n            continue\n        v = [b for b in BANNED if re.search(b, out.get(\"main\", \"\"))]\n        if \"http\" in out.get(\"main\", \"\") or \"쿠팡\" in out.get(\"main\", \"\"):\n            v.append(\"링크/쇼핑 언급\")\n        if not v:\n            return out\n        user += f\"\\n\\n[직전 출력 규칙 위반: {v}. 다시 작성]\"\n    return content_template(arms)\n\n\ndef content_template(arms):\n    banmal = arms.get(\"tone\") == \"친구반말\"\n    niche = Config.NICHE.split(\",\")[0].strip()\n    t = {\n        \"질문토론\": f\"{niche} 살 때 {'너는' if banmal else '여러분은'} 가격 먼저 {'봐' if banmal else '보세요'}, 후기 먼저 {'봐?' if banmal else '보세요?'}\",\n        \"생활팁\": f\"{niche} 오래 쓰는 팁\\n1. 처음 받으면 구성품부터 확인\\n2. 세척 방법 미리 체크\\n3. 보증 기간 메모\",\n    }\n    return {\"main\": t.get(arms.get(\"content_type\"), t[\"질문토론\"]), \"topic_tag\": niche.replace(\" \", \"\")}\n"};
const BOT_VERSION = "2026.09.27";
</script>
<script>
"use strict";
const REPO_DEFAULT = "threads-bot";
const WF = "threads-bot.yml";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => (n || 0).toLocaleString("ko-KR");

/* ---------------- 저장 (이 브라우저에만) ---------------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("threadsbot") || "{}"); } catch { return {}; } },
  set(v) { try { localStorage.setItem("threadsbot", JSON.stringify(v)); } catch {} },
  patch(p) { const v = { ...store.get(), ...p }; store.set(v); return v; },
  clear() { try { localStorage.removeItem("threadsbot"); } catch {} },
};
let S = store.get();

/* ---------------- GitHub API ---------------- */
async function gh(method, path, body, token = S.token) {
  const r = await fetch("https://api.github.com" + path, {
    method,
    headers: { Authorization: "token " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
               ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 204) return { _headers: r.headers };
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) {
    const e = new Error(ghMessage(r.status, j)); e.status = r.status; e.body = j; throw e;
  }
  if (j && typeof j === "object") Object.defineProperty(j, "_headers", { value: r.headers });
  return j;
}
function ghMessage(status, j) {
  const m = (j && j.message) || "";
  if (status === 401) return "깃허브 토큰이 잘못됐거나 만료됐어요. 설정에서 토큰을 다시 넣어주세요.";
  if (status === 403 && /rate limit/i.test(m)) return "깃허브 요청 한도에 걸렸어요. 잠시 후 다시 시도해 주세요.";
  if (status === 403 || /scope|permission/i.test(m)) return "토큰 권한이 부족해요. 토큰을 만들 때 repo, workflow를 체크했는지 확인해 주세요.";
  if (status === 404) return "찾을 수 없어요 (" + m + ")";
  return m || ("오류 " + status);
}
const repoPath = () => `/repos/${S.owner}/${S.repo}`;

function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
async function readFile(path) {
  try {
    const j = await gh("GET", `${repoPath()}/contents/${encodeURI(path)}?ref=main&t=${Date.now()}`);
    return { text: b64dec(j.content || ""), sha: j.sha };
  } catch (e) { if (e.status === 404) return null; throw e; }
}
async function writeFile(path, text, message, sha) {
  if (sha === undefined) { const cur = await readFile(path); sha = cur && cur.sha; }
  return gh("PUT", `${repoPath()}/contents/${encodeURI(path)}`, { message, content: b64enc(text), ...(sha ? { sha } : {}), branch: "main" });
}
async function readJSON(path) { const f = await readFile(path); if (!f) return null; try { return JSON.parse(f.text); } catch { return null; } }

/* 여러 파일을 커밋 1번으로 올리기 */
async function pushFiles(files, message, owner = S.owner, repo = S.repo) {
  const rp = `/repos/${owner}/${repo}`;
  let ref;
  for (let i = 0; i < 15; i++) {
    try { ref = await gh("GET", `${rp}/git/ref/heads/main`); break; } catch (e) { await sleep(2000); }
  }
  if (!ref) throw new Error("저장소가 준비되지 않았어요. 잠시 후 다시 시도해 주세요.");
  const base = await gh("GET", `${rp}/git/commits/${ref.object.sha}`);
  const tree = await gh("POST", `${rp}/git/trees`, { base_tree: base.tree.sha,
    tree: Object.entries(files).map(([path, content]) => ({ path, mode: "100644", type: "blob", content })) });
  const commit = await gh("POST", `${rp}/git/commits`, { message, tree: tree.sha, parents: [ref.object.sha] });
  await gh("PATCH", `${rp}/git/refs/heads/main`, { sha: commit.sha });
}

/* 비밀 키 암호화 등록 */
async function setSecrets(obj) {
  const pk = await gh("GET", `${repoPath()}/actions/secrets/public-key`);
  const key = Uint8Array.from(atob(pk.key), c => c.charCodeAt(0));
  for (const [name, val] of Object.entries(obj)) {
    if (!val) continue;
    const sealed = sealBox(new TextEncoder().encode(val.trim()), key);
    let bin = ""; sealed.forEach(b => bin += String.fromCharCode(b));
    await gh("PUT", `${repoPath()}/actions/secrets/${name}`, { encrypted_value: btoa(bin), key_id: pk.key_id });
  }
}

/* 봇 실행 요청 → 완료까지 기다림 */
const CMD_LABEL = { auto: "자동 실행", cron: "자동 실행", check: "연결 확인", post: "글 올리기", preview: "미리보기",
  learn: "학습·회고", import: "기존 글 가져오기", suggest: "상품 추천 찾기", report: "리포트" };
let busy = false;
async function runBot(command, { onDone, quiet } = {}) {
  if (busy) { toast("다른 작업이 진행 중이에요. 잠시만요."); return; }
  busy = true;
  const t0 = Date.now();
  const label = CMD_LABEL[command.split(" ")[0]] || command;
  try {
    let ok = false;
    for (let i = 0; i < 10 && !ok; i++) {
      try { await gh("POST", `${repoPath()}/actions/workflows/${WF}/dispatches`, { ref: "main", inputs: { command } }); ok = true; }
      catch (e) { if (e.status === 404 || e.status === 422) await sleep(3000); else throw e; }
    }
    if (!ok) throw new Error("실행 요청이 거절됐어요. 잠시 후 다시 눌러주세요.");
    toast(`「${label}」 요청했어요. 깃허브가 실행 중… (보통 1~2분)`, 0, true);
    let run = null;
    for (let i = 0; i < 90; i++) {
      await sleep(i < 3 ? 3000 : 5000);
      const j = await gh("GET", `${repoPath()}/actions/runs?event=workflow_dispatch&per_page=5`);
      run = (j.workflow_runs || []).find(r => new Date(r.created_at).getTime() >= t0 - 15000 && r.display_title === command) || run;
      if (run && run.status === "completed") break;
      if (run) toast(`「${label}」 ${run.status === "queued" ? "대기 중" : "실행 중"}… ${Math.round((Date.now() - t0) / 1000)}초`, 0, true);
    }
    if (!run || run.status !== "completed") { toast(`「${label}」가 오래 걸리고 있어요. 나중에 홈에서 확인해 주세요.`); return; }
    if (run.conclusion === "success") { if (quiet) hideToast(); else toast(`「${label}」 완료!`); await sleep(1500); onDone && (await onDone(run)); }
    else toast(`「${label}」 실패했어요. 홈 > 최근 실행에서 확인해 주세요.`, 6000);
    return run;
  } catch (e) { toast(e.message, 6000); }
  finally { busy = false; }
}

let toastTimer;
function toast(msg, ms = 3500, spinning = false) {
  const t = $("#toast"); t.innerHTML = (spinning ? '<span class="spin"></span> ' : "") + esc(msg); t.style.display = "block";
  clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(() => t.style.display = "none", ms);
}
function hideToast() { clearTimeout(toastTimer); $("#toast").style.display = "none"; }
function modal(html) { $("#modal").innerHTML = html; $("#modalBg").style.display = "flex"; }
function closeModal() { $("#modalBg").style.display = "none"; }

/* ---------------- settings.env / products.csv ---------------- */
function parseEnv(text) { const o = {}; text.split(/\r?\n/).forEach(l => { const m = l.match(/^\s*([A-Z_]+)\s*=(.*)$/); if (m) o[m[1]] = m[2].trim(); }); return o; }
function updateEnv(text, patch) {
  const done = new Set();
  let out = text.split(/\r?\n/).map(l => { const m = l.match(/^\s*([A-Z_]+)\s*=/); if (m && m[1] in patch) { done.add(m[1]); return `${m[1]}=${patch[m[1]]}`; } return l; });
  for (const k in patch) if (!done.has(k)) out.push(`${k}=${patch[k]}`);
  return out.join("\n");
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().replace(/^﻿/, ""));
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}
const CSV_COLS = ["name", "price", "url", "image", "category", "keyword"];
function toCSV(items) {
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [CSV_COLS.join(","), ...items.map(it => CSV_COLS.map(c => q(it[c])).join(","))].join("\n") + "\n";
}

function bindWizard() {
  const on = (id, ev, fn) => { const el = $("#" + id); if (el) el.addEventListener(ev, fn); };
  on("next0", "click", async () => {
    const tok = $("#ghTok").value.trim(); W.ghToken = tok;
    if (!tok) return ($("#ghMsg").innerHTML = `<div class="banner bad">토큰을 붙여넣어 주세요.</div>`);
    $("#next0").innerHTML = '<span class="spin"></span> 확인 중'; $("#next0").disabled = true;
    try {
      const u = await gh("GET", "/user", null, tok);
      const scopes = (u._headers.get("x-oauth-scopes") || "");
      if (scopes && !(/\brepo\b/.test(scopes) && /\bworkflow\b/.test(scopes)))
        throw new Error("토큰에 repo와 workflow 권한이 모두 필요해요. 위 버튼으로 토큰을 다시 만들어 주세요.");
      W.user = u;
      // 이미 설치돼 있으면 바로 연결
      try {
        await gh("GET", `/repos/${u.login}/${REPO_DEFAULT}/contents/.github/workflows/${WF}`, null, tok);
        S = store.patch({ token: tok, owner: u.login, repo: REPO_DEFAULT });
        toast("이미 설치된 봇을 찾았어요. 바로 연결할게요!");
        return startApp();
      } catch (e) { if (e.status !== 404) throw e; }
      W.step = 1; renderWizard();
    } catch (e) {
      $("#ghMsg").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`;
      $("#next0").innerHTML = "연결하기"; $("#next0").disabled = false;
    }
  });
  const grabKeys = () => {
    const v = id => ($("#" + id) ? $("#" + id).value.trim() : "");
    W.keys = { THREADS_ACCESS_TOKEN: v("kThreads"), THREADS_APP_SECRET: v("kSecret"), ANTHROPIC_API_KEY: v("kClaude"),
               COUPANG_ACCESS_KEY: v("kCpA"), COUPANG_SECRET_KEY: v("kCpS") };
  };
  on("back1", "click", () => { grabKeys(); W.step = 0; renderWizard(); });
  on("next1", "click", () => {
    grabKeys();
    const k = W.keys, errs = [];
    if (!k.THREADS_ACCESS_TOKEN) errs.push("쓰레드 토큰을 넣어주세요.");
    if (!k.ANTHROPIC_API_KEY) errs.push("Claude API 키를 넣어주세요.");
    else if (!k.ANTHROPIC_API_KEY.startsWith("sk-ant-")) errs.push("Claude API 키는 sk-ant- 로 시작해요.");

    W.step = 2; renderWizard();
  });
  on("skipKeys", "click", e => { e.preventDefault(); grabKeys(); W.step = 2; renderWizard(); });
  document.querySelectorAll("#nicheChips .chip").forEach(b => b.addEventListener("click", () => {
    const n = b.dataset.n; W.niche = W.niche.includes(n) ? W.niche.filter(x => x !== n) : [...W.niche, n]; b.classList.toggle("on");
  }));

async function doInstall() {
  const steps = ["비공개 저장소 만들기", "프로그램 올리기", "API 키 암호화해서 등록", "자동 실행 켜기", "연결 확인하기"];
  const prog = $("#prog"); const btn = $("#install"); btn.disabled = true; $("#back3").classList.add("hide");
  const mark = (i, state, extra = "") => {
    prog.innerHTML = steps.map((s, j) => {
      const st = j < i ? "done" : j === i ? state : "";
      const ic = st === "done" ? "✅" : st === "doing" ? '<span class="spin"></span>' : st === "fail" ? "❌" : "○";
      return `<li class="${st}"><span class="s">${ic}</span><span class="grow">${s}${j === i && extra ? `<br><span class="muted">${esc(extra)}</span>` : ""}</span></li>`;
    }).join("");
  };
  const tok = W.ghToken, owner = W.user.login, repo = REPO_DEFAULT;
  S = { token: tok, owner, repo }; let i = 0;
  try {
    mark(0, "doing");
    try { await gh("POST", "/user/repos", { name: repo, private: true, auto_init: true, description: "쓰레드 × 쿠팡파트너스 자동화 (관리앱으로 설치)" }); }
    catch (e) { if (e.status !== 422) throw e; } // 이미 있으면 그대로 사용
    i = 1; mark(1, "doing", "파일 " + Object.keys(BOT_FILES).length + "개");
    const files = { ...BOT_FILES };
    files["settings.env"] = updateEnv(files["settings.env"], {
      NICHE: W.niche.join(", "), PERSONA: PERSONAS[W.persona].text, POSTS_PER_DAY: W.perDay,
      CONTENT_RATIO: (W.contentRatio / 100).toFixed(2) });
    await pushFiles(files, "관리앱으로 설치 (" + BOT_VERSION + ")", owner, repo);
    i = 2; mark(2, "doing");
    await setSecrets(W.keys);
    i = 3; mark(3, "doing");
    try { await gh("PUT", `${repoPath()}/actions/permissions/workflow`, { default_workflow_permissions: "write", can_approve_pull_request_reviews: false }); } catch {}
    try { await gh("PUT", `${repoPath()}/actions/workflows/${WF}/enable`); } catch {}
    i = 4; mark(4, "doing", "깃허브가 처음 실행하는 데 1~2분 걸려요");
    store.set(S);
    const run = await runBot("check", { quiet: true });
    mark(5, "done");
    btn.classList.add("hide");
    const res = await readJSON("data/연결확인.json");
    prog.insertAdjacentHTML("afterend", `<div class="banner info"><b>설치 완료!</b> 이제 매시간 알아서 움직여요.</div>` + (res ? checkHTML(res) : "") +
      `<button class="btn primary big" id="goApp" style="margin-top:12px">관리 화면으로</button>`);
    $("#goApp").addEventListener("click", startApp);
  } catch (e) {
    mark(i, "fail", e.message); btn.disabled = false; btn.textContent = "다시 시도";
  }
}

function checkHTML(res) {
  return `<div class="card"><h2>연결 확인 <span class="muted" style="font-weight:400">${esc(res.at)}</span></h2>` +
    res.items.map(it => `<div class="check"><span>${it.ok ? "✅" : "⚠️"}</span><div><b>${esc(it.name)}</b><br><span class="muted">${esc(it.detail)}</span></div></div>`).join("") + `</div>`;
}

function timeAgo(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "방금"; if (s < 3600) return Math.floor(s / 60) + "분 전"; if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return Math.floor(s / 86400) + "일 전";
}
function barChart(days) {
  const W_ = 360, H = 150, pad = 26, n = days.length, max = Math.max(1, ...days.map(d => d.views));
  const bw = (W_ - pad) / n, gap = 4;
  const nice = v => v >= 1e4 ? (v / 1e4).toFixed(1).replace(/\.0$/, "") + "만" : fmt(v);
  const bars = days.map((d, i) => {
    const h = Math.max(d.views ? 3 : 0, (d.views / max) * (H - 36)), x = pad + i * bw + gap / 2, y = H - 18 - h, w = bw - gap;
    const r = Math.min(4, w / 2, h);
    const path = h ? `M${x},${H - 18} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${H - 18} Z` : "";
    return `<g class="b" data-i="${i}"><rect x="${pad + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
      ${path ? `<path d="${path}" fill="var(--accent)"/>` : `<rect x="${x}" y="${H - 19}" width="${w}" height="1" fill="var(--line)"/>`}
      ${i % 2 === (n - 1) % 2 ? `<text x="${x + w / 2}" y="${H - 3}" font-size="11" text-anchor="middle" fill="var(--ink-3)">${esc(d.date)}</text>` : ""}</g>`;
  }).join("");
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="최근 14일 조회수 막대 그래프">
    <line x1="${pad}" x2="${W_}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line)"/>
    <text x="0" y="12" font-size="11" fill="var(--ink-3)">${nice(max)}</text>${bars}</svg><div class="tip" id="tip"></div></div>
    <table class="hide">${days.map(d => `<tr><td>${d.date}</td><td>${d.views}</td></tr>`).join("")}</table>`;
}

    <label class="f">상품 이름 *</label><input class="i" id="pName" value="${esc(p.name || "")}" placeholder="예: 규조토 발매트 대형">

    <div class="hint">쿠팡 상품 이미지를 길게 눌러 '이미지 주소 복사'하면 돼요.</div>

  $("#pSave").onclick = async () => {

                 keyword: $("#pKw").value.trim(), image: $("#pImg").value.trim(), category: p.category || "" };
    if (!it.name || !/^https?:\/\//.test(it.url)) return ($("#pMsg").innerHTML = `<div class="banner bad">상품 이름과 링크(https://...)를 넣어주세요.</div>`);
    if (!/coupang\.com|coupa\.ng/.test(it.url)) return ($("#pMsg").innerHTML = `<div class="banner bad">쿠팡 파트너스 링크(link.coupang.com)만 넣어주세요.</div>`);
    if (!D.products) await loadProducts();
    const items = D.products.items.slice(); if (idx >= 0) items[idx] = it; else items.push(it);
    await saveProducts(items, idx >= 0 ? "상품 수정" : "상품 추가: " + it.name);
  };
  if (idx >= 0) $("#pDel").onclick = async () => { const items = D.products.items.filter((_, i) => i !== idx); await saveProducts(items, "상품 삭제: " + p.name); };

function bulkForm() {
  modal(`<h2>여러 개 한 번에 추가</h2><p class="muted">한 줄에 하나씩: <code>상품이름, 가격, 간편링크</code> (가격은 비워도 돼요)</p>
    <textarea class="i" id="bulkTxt" style="min-height:180px" placeholder="규조토 발매트, 15900, https://link.coupang.com/a/abc\n무선 음식물 처리기, , https://link.coupang.com/a/def"></textarea>
    <div id="bMsg"></div><div class="grid2" style="margin-top:14px"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="bSave">추가</button></div>`);
  $("#bSave").onclick = async () => {
    if (!D.products) await loadProducts();
    const add = [], bad = [];
    $("#bulkTxt").value.split("\n").map(l => l.trim()).filter(Boolean).forEach((l, n) => {
      const url = (l.match(/https?:\/\/\S+/) || [""])[0];
      const rest = l.replace(url, "").split(",").map(s => s.trim()).filter(Boolean);
      const name = rest[0], price = (rest.find(x => /^[\d,]+원?$/.test(x)) || "").replace(/\D/g, "");
      if (name && url) add.push({ name, url, price, keyword: "", image: "", category: "" }); else bad.push(n + 1);
    });
    if (!add.length) return ($("#bMsg").innerHTML = `<div class="banner bad">형식을 확인해 주세요.</div>`);
    await saveProducts(D.products.items.concat(add), `상품 ${add.length}개 추가`);
    if (bad.length) toast(`${add.length}개 추가, ${bad.length}줄은 형식이 달라 건너뛰었어요.`, 5000);
  };
}
async function loadProducts() {
  const f = await readFile("products.csv");
  D.products = { sha: f && f.sha, items: f ? parseCSV(f.text).filter(r => r.url || r.name) : [] };
}
async function saveProducts(items, msg) {
  const b = $("#pSave") || $("#bSave"); if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span>'; }
  try {
    const r = await writeFile("products.csv", toCSV(items), msg, D.products.sha);
    D.products = { sha: r.content.sha, items };
    closeModal(); toast("저장했어요. 다음 실행부터 반영돼요."); render();
  } catch (e) {
    if (e.status === 409 || e.status === 422) { await loadProducts(); toast("다른 곳에서 바뀌어서 새로 불러왔어요. 다시 저장해 주세요.", 5000); render(); }
    else toast(e.message, 5000);
    if (b) { b.disabled = false; b.textContent = "저장"; }
  }
}

/* ---- 이벤트 ---- */
function bindView() {
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = () => {
    const c = b.dataset.run;
    if (c === "post" && !confirm("AI가 지금 글 1개를 골라 쓰레드에 바로 올릴게요. 진행할까요?")) return;
    runBot(c, { onDone: refreshAll });
  });
  const $id = id => document.getElementById(id);
  if ($id("power")) $id("power").onchange = async e => {
    const want = e.target.checked;
    try { await gh("PUT", `${repoPath()}/actions/workflows/${WF}/${want ? "enable" : "disable"}`); D.wf = { ...(D.wf || {}), state: want ? "active" : "disabled_manually" };
      toast(want ? "자동 운영을 켰어요." : "일시정지했어요. 켜기 전까지 아무것도 올리지 않아요."); render(); }
    catch (err) { toast(err.message, 5000); e.target.checked = !want; }
  };
  if ($id("reload")) $id("reload").onclick = () => { toast("새로고침 중…", 1500); refreshAll(); };
  document.querySelectorAll('[data-act="preview"]').forEach(b => b.onclick = () => runBot("preview", { onDone: showPreview }));
  document.querySelectorAll('[data-act="check"]').forEach(b => b.onclick = () => runBot("check", { onDone: async () => {
    const r = await readJSON("data/연결확인.json"); if (r) modal(checkHTML(r) + `<button class="btn big" onclick="closeModal()">닫기</button>`); refreshAll(); } }));
  const chart = $id("chart");
  if (chart) chart.querySelectorAll(".b").forEach(g => {
    const show = () => { const d = D.dash.days[+g.dataset.i]; const tip = $id("tip");
      const bb = g.getBoundingClientRect(), cb = chart.getBoundingClientRect();
      tip.innerHTML = `${esc(d.date)} · 조회 <b>${fmt(d.views)}</b> · 글 ${d.posts}개`; tip.style.left = (bb.left - cb.left + bb.width / 2) + "px"; tip.style.top = "40px"; tip.style.opacity = 1; };
    g.addEventListener("mouseenter", show); g.addEventListener("click", show);
    g.addEventListener("mouseleave", () => $id("tip").style.opacity = 0);
  });
  // 상품
  if (TAB === "products" && !D.products && !(D.dash && D.dash.coupang_api)) loadProducts().then(render).catch(e => toast(e.message));
  if ($id("addProd")) $id("addProd").onclick = () => productForm();
  if ($id("bulk")) $id("bulk").onclick = bulkForm;
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => productForm(D.products.items[+b.dataset.edit], +b.dataset.edit));
  document.querySelectorAll("[data-addkw]").forEach(b => b.onclick = () => productForm({ keyword: b.dataset.addkw }));
  // 설정
  if (TAB === "settings" && !D.secretsLoaded) { D.secretsLoaded = true;
    Promise.all([D.env ? D.env : readFile("settings.env"), gh("GET", `${repoPath()}/actions/secrets`).catch(() => ({ secrets: [] }))])
    .then(([f, s]) => { D.env = f || { text: "", sha: null }; D.secrets = (s.secrets || []).map(x => x.name); render(); }).catch(e => toast(e.message)); }
  if ($id("sPd")) $id("sPd").oninput = e => $id("sPdV").textContent = e.target.value;
  if ($id("sCr")) $id("sCr").oninput = e => $id("sCrV").textContent = e.target.value;
  if ($id("sSave")) $id("sSave").onclick = async () => {
    const patch = { POSTS_PER_DAY: $id("sPd").value, CONTENT_RATIO: (+$id("sCr").value / 100).toFixed(2), AUTO_REPLY: $id("sReply").checked ? "true" : "false",
      DRY_RUN: $id("sDry").checked ? "true" : "false", NICHE: $id("sNiche").value.replace(/\n/g, " ").trim(), PERSONA: $id("sPersona").value.replace(/\n/g, " ").trim() };
    try { const txt = updateEnv(D.env.text, patch); const r = await writeFile("settings.env", txt, "관리앱에서 설정 변경", D.env.sha);
      D.env = { text: txt, sha: r.content.sha }; toast("저장했어요. 다음 실행부터 반영돼요."); }
    catch (e) { D.env = null; toast(e.message + " — 다시 시도해 주세요.", 5000); render(); }
  };
  if ($id("kSave")) $id("kSave").onclick = async () => {
    const obj = {}; document.querySelectorAll("[data-secret]").forEach(i => { if (i.value.trim()) obj[i.dataset.secret] = i.value.trim(); });
    if (!Object.keys(obj).length) return toast("바꿀 키를 입력해 주세요.");
    try { await setSecrets(obj); D.secrets = [...new Set([...D.secrets, ...Object.keys(obj)])]; toast("키를 저장했어요. 연결 확인을 눌러 점검해 보세요."); render(); }
    catch (e) { toast(e.message, 5000); }
  };
  if ($id("mkPages")) $id("mkPages").onclick = makePages;
  if ($id("copyLink")) $id("copyLink").onclick = async () => {
    const link = `${S.pagesUrl}#connect=${encodeURIComponent(btoa(JSON.stringify({ t: S.token, o: S.owner, r: S.repo })))}`;
    try { await navigator.clipboard.writeText(link); toast("복사했어요. 나에게만 보내 폰에서 열어주세요."); } catch { prompt("아래 링크를 복사하세요", link); }
  };
  if ($id("upd")) $id("upd").onclick = async () => {
    if (!confirm("프로그램 파일을 이 관리앱에 들어 있는 버전으로 업데이트할게요. 상품 목록·설정·학습 데이터는 그대로예요.")) return;
    try { const files = { ...BOT_FILES }; delete files["settings.env"]; delete files["products.csv"];
      toast("업데이트 중…", 0, true); await pushFiles(files, "관리앱에서 프로그램 업데이트 (" + BOT_VERSION + ")"); toast("업데이트했어요."); }
    catch (e) { toast(e.message, 5000); }
  };
  if ($id("logout")) $id("logout").onclick = () => { if (confirm("이 기기에서만 연결을 해제해요. 봇은 계속 돌아가요.")) { store.clear(); location.reload(); } };
}

    p.items.map(it => `<h3>${it.type === "product" ? "상품 글 — " + esc(it.product && it.product.name) : "일반 글"}</h3>

      ${i === 0 && it.product && it.product.image && it.arms.format === "image_post" ? `<img src="${esc(it.product.image)}" alt="" style="width:100%;max-width:280px;border-radius:10px;margin-bottom:8px">` : ""}
      <div class="body">${esc(pc.text)}</div></div>`).join("")).join("") +
    `<div class="grid2" style="margin-top:14px"><button class="btn" onclick="closeModal()">닫기</button><button class="btn primary" id="again">다시 만들기</button></div>`);
  $("#again").onclick = () => { closeModal(); runBot("preview", { onDone: showPreview }); };

async function makePages() {
  const appRepo = S.repo + "-app";
  try {
    toast("내 관리앱 주소를 만드는 중…", 0, true);
    try { await gh("POST", "/user/repos", { name: appRepo, private: false, auto_init: true, description: "쓰레드봇 관리앱 (키는 들어있지 않아요)" }); }
    catch (e) { if (e.status !== 422) throw e; }
    await pushFiles({ "index.html": PRISTINE, ".nojekyll": "" }, "관리앱 올리기", S.owner, appRepo);
    try { await gh("POST", `/repos/${S.owner}/${appRepo}/pages`, { build_type: "legacy", source: { branch: "main", path: "/" } }); }
    catch (e) { if (e.status !== 409) throw e; }
    const url = `https://${S.owner.toLowerCase()}.github.io/${appRepo}/`;
    S = store.patch({ pagesUrl: url });
    toast("완료! 1~2분 뒤부터 열려요.", 5000); render();
  } catch (e) { toast(e.message, 6000); }
}

/* ---- 시작 ---- */
function boot() {
  const m = location.hash.match(/connect=([^&]+)/);
  if (m) {
    try { const c = JSON.parse(atob(decodeURIComponent(m[1]))); S = store.patch({ token: c.t, owner: c.o, repo: c.r, pagesUrl: location.href.split("#")[0] }); } catch {}
    history.replaceState(null, "", location.pathname + location.search);
  }
  if (location.protocol.startsWith("http") && !S.pagesUrl && /github\.io$/.test(location.hostname)) S = store.patch({ pagesUrl: location.href.split("#")[0] });
  S.token && S.owner ? startApp() : renderWizard();
}
document.addEventListener("DOMContentLoaded", boot);
