<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쓰레드봇 관리앱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0efeb; --line:#e4e2dc;
  --ink:#1b1a17; --ink-2:#55524b; --ink-3:#8b877e;
  --accent:#0f6e64; --accent-ink:#ffffff; --accent-soft:#e1f0ed;
  --good:#1f7a3a; --good-soft:#e3f3e7; --warn:#9a5b00; --warn-soft:#fbf0dc;
  --bad:#b3261e; --bad-soft:#fbe6e4;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121210; --surface:#1c1b19; --surface-2:#252421; --line:#2f2e2a;
    --ink:#f2f0ea; --ink-2:#bdb9ae; --ink-3:#8a867c;
    --accent:#4cc3b1; --accent-ink:#0b1f1c; --accent-soft:#16332f;
    --good:#6fd08c; --good-soft:#18301f; --warn:#f0b659; --warn-soft:#352813;
    --bad:#ff8a80; --bad-soft:#3a1a18; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
h1{font-size:24px;line-height:1.3;margin:28px 0 6px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14px;margin:18px 0 8px;color:var(--ink-2)}
p.sub{color:var(--ink-2);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.muted{color:var(--ink-3);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:44px;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{flex-direction:column;gap:2px;padding:14px 10px;min-height:76px}
.actions .btn small{font-weight:500;color:var(--ink-3);font-size:12px}
.actions .btn .ico{font-size:20px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-3)}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
input.i,textarea.i,select.i{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:12px;font:inherit;min-height:46px}
textarea.i{min-height:90px;resize:vertical}
input.i:focus,textarea.i:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(22px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.steps{display:flex;gap:6px;margin:18px 0 4px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
details.help{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:10px 0;background:var(--surface-2)}
details.help summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary:before{content:"＋ ";color:var(--accent)}
details.help[open] summary:before{content:"－ "}
details.help ol{padding-left:20px;margin:0 0 14px}
details.help li{margin:6px 0;font-size:14px}
code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px}
.progress{list-style:none;padding:0;margin:16px 0}
.progress li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-3)}
.progress li.doing{color:var(--ink)} .progress li.done{color:var(--ink)}
.progress li .s{width:22px;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);cursor:pointer;min-height:58px}
nav.tabs button .ico{font-size:19px;line-height:1.1}
nav.tabs button.on{color:var(--accent);font-weight:700}
.post{border-top:1px solid var(--line);padding:14px 0}
.post:first-child{border-top:0;padding-top:0}
.post .txt{white-space:pre-wrap;margin:6px 0 8px;font-size:14.5px}
.metrics{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:600}
.tag.ad{background:var(--accent-soft);color:var(--accent)}
.meter{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.meter .bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.meter.off{opacity:.45}
.meter .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.best{font-size:11px;color:var(--accent);font-weight:700;margin-left:4px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.prod{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod img,.prod .ph{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none;display:grid;place-items:center;color:var(--ink-3)}
.prod .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.th{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.th .who{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-bottom:6px}
.th .av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.th.reply{margin-left:22px;border-left:3px solid var(--line)}
.th .body{white-space:pre-wrap;font-size:14.5px}
.check{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.check:first-child{border-top:0}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.runs .r{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.runs .r:first-child{border-top:0}
pre.log{white-space:pre-wrap;font-size:12.5px;background:var(--surface-2);padding:12px;border-radius:10px;max-height:320px;overflow:auto;margin:0}
.hide{display:none!important}
.center{text-align:center}
.hero-ico{font-size:44px;margin-top:40px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="logo">@</div><div class="brand" id="brand">쓰레드봇 관리앱</div><span id="statusPill"></span></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs hide" id="tabs"><div class="wrap">
  <button data-tab="home"><span class="ico">⌂</span>홈</button>
  <button data-tab="posts"><span class="ico">✎</span>게시물</button>
  <button data-tab="learn"><span class="ico">✦</span>AI 학습</button>
  <button data-tab="products"><span class="ico">▦</span>상품</button>
  <button data-tab="settings"><span class="ico">⚙</span>설정</button>
</div></nav>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

if cmd == \"preview\":\n        eng.discover() if not eng.db.one(\"SELECT 1 FROM products\") else None\n        t = sys.argv[2] if len(sys.argv) > 2 and sys.argv[2] in (\"product\", \"content\") else None\n        for kind in ([t] if t else [\"product\", \"content\"]):\n            eng.post_once(force_type=kind)\n        save_json(\"미리보기.json\", {\"at\": now_str(), \"items\": eng.previews})\n    elif cmd == \"discover\":\n        eng.db.kv_set(\"last_trend_scan\", 0)\n        eng.discover()\n    elif cmd == \"learn\":\n        eng.lr.collect(); eng.lr.learn(); r = eng.lr.reflect()\n        if r:\n            print(\"\\n=== 새 플레이북 ===\\n\" + r.get(\"playbook\", \"\"))\n    elif cmd == \"report\":\n        print(\"리포트:\", __import__(\"bot.report\", fromlist=[\"build\"]).build(eng))\n    elif cmd == \"simulate\":\n        simulate(eng, int(sys.argv[2]) if len(sys.argv) > 2 else 60)\n    else:\n        print(__doc__); return\n    if cmd not in (\"run\", \"report\", \"simulate\"):\n        __import__(\"bot.report\", fromlist=[\"build\"]).build(eng)  # 관리앱 대시보드 갱신\n\n\ndef now_str():\n    import datetime as dt\n    from zoneinfo import ZoneInfo\n    return dt.datetime.now(ZoneInfo(Config.TIMEZONE)).strftime(\"%Y-%m-%d %H:%M\")\n\n\ndef save_json(name, data):\n    from bot.config import ROOT\n    (ROOT / \"data\").mkdir(exist_ok=True)\n    (ROOT / \"data\" / name).write_text(json.dumps(data, ensure_ascii=False, indent=1), encoding=\"utf-8\")\n\n\ndef check(eng):\n    \"\"\"연결 상태를 점검해 data/연결확인.json 으로 저장 (관리앱이 읽음)\"\"\"\n    items = []\n\n    def add(name, ok, detail):\n        items.append({\"name\": name, \"ok\": ok, \"detail\": detail})\n        print((\"✅ \" if ok else \"❌ \") + name + \": \" + detail)\n\n    if Config.has_threads():\n        try:\n            me = eng.th.me()\n            q = eng.th.publishing_quota()\n            add(\"쓰레드\", True, f\"@{me.get('username')} 연결됨 (오늘 게시 {q.get('quota_usage', 0)}/250)\")\n        except Exception as e:\n            add(\"쓰레드\", False, f\"토큰 오류 — 토큰을 다시 발급해 넣어주세요 ({str(e)[:150]})\")\n    else:\n        add(\"쓰레드\", False, \"토큰 없음 — 지금은 연습(시뮬레이션) 모드예요\")\n    if Config.has_llm():\n        try:\n            from bot import llm\n            llm.ask(\"연결 테스트\", \"OK라고만 답해\", max_tokens=5)\n            add(\"Claude AI\", True, f\"연결됨 ({Config.LLM_MODEL})\")\n        except Exception as e:\n            add(\"Claude AI\", False, f\"키 또는 모델 오류 ({str(e)[:150]})\")\n    else:\n        add(\"Claude AI\", False, \"키 없음 — 글 품질이 크게 떨어져요\")\n    if Config.has_coupang():\n        try:\n            g = eng.cp.goldbox()\n            add(\"쿠팡 API\", True, f\"연결됨 (골드박스 {len(g)}개)\")\n        except Exception as e:\n            add(\"쿠팡 API\", False, str(e)[:150])\n    else:\n        eng.ex.collect_products()\n        n = eng.ex.available_count()\n        add(\"쿠팡 상품\", n > 0, f\"상품 목록 {n}개 사용 가능\" + (\"\" if n else \" — 상품 탭에서 추가해 주세요\"))\n    save_json(\"연결확인.json\", {\"at\": now_str(), \"items\": items})\n\n\ndef simulate(eng, n):\n    \"\"\"쓰레드 토큰 없이 전체 루프를 빨리감기로 돌려 학습이 수렴하는지 확인\"\"\"\n    if not eng.th.sim:\n        print(\"실제 토큰이 설정되어 있어 시뮬레이션을 막았습니다 (.env의 THREADS_ACCESS_TOKEN을 비우고 실행)\"); return\n    eng.discover()\n    for i in range(n):\n        slot = eng.st.sample(\"time_slot\")[\"arm\"]\n        pid = eng.post_once(slot)\n        if pid:\n            # 시간을 과거로 돌려 '48시간 지난 게시물'처럼 만든다\n            eng.db.x(\"UPDATE posts SET posted_at=? WHERE id=?\", (time.time() - 72 * 3600, pid))\n            eng.db.x(\"UPDATE posts SET arms=json_set(arms,'$.time_slot',?) WHERE id=?\", (slot, pid))\n        eng.db.x(\"UPDATE posts SET metrics_at=NULL\")\n        eng.lr.collect(); eng.lr.learn()\n        if i % 10 == 0:\n            eng.db.x(\"UPDATE products SET last_posted_at=NULL\")  # 가짜 상품이 적어 재사용\n        if (i + 1) % 20 == 0:\n            eng.lr.reflect()\n    print(\"\\n=== 학습 결과 (숨은 정답: 공감상황형·문제해결형 / image_post / first_reply / 21-23 / 친구반말) ===\")\n    for a in eng.st.table():\n        print(f\"{a['dimension']:15s} {a['arm']:12s} 평균 {a['mean']:.2f}  시도 {a['pulls']}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "requirements.txt": "requests>=2.31\npython-dotenv>=1.0\ntzdata; platform_system == \"Windows\"\n", "README.md": "# 쓰레드 × 쿠팡파트너스 자기학습형 자동화\n\n**컴퓨터를 꺼둬도** 깃허브가 1시간마다 대신 실행합니다. 매번 실행될 때 \"지금 올릴 차례인 글이 있는지, 댓글에 답할 게 있는지, 성과를 모을 때인지\"를 스스로 판단하고 끝납니다. 학습 데이터는 저장소에 자동 저장돼 다음 실행으로 이어집니다.\n\n## 스스로 하는 일\n\n| 하는 일 | 설명 | 주기 |\n|---|---|---|\n| 트렌드 탐색 | 쓰레드 인기글에서 사람들의 고민을 읽고, AI가 팔릴 만한 상품 키워드를 제안 (시즌 반영) | 12시간 |\n| 글 게시 | 하루 4개, 매일 다른 시각. 그중 약 35%는 **광고 없는 일반 글**(생활팁·질문·공감)로 팔로워 확보 | 일정대로 |\n| 상품 글 | 첫 문장 스타일·형식·말투·링크 위치를 조합해 테스트. 링크는 첫 댓글, 광고 표기 자동 | 일정대로 |\n| 댓글 답글 | 내 글에 달린 댓글에 AI가 자연스럽게 답함 (하루 20개 한도, 스팸·욕설은 무시) | 1시간 |\n| 성과 수집 | 조회·좋아요·댓글·공유 (+ 쿠팡 API 받으면 주문까지) | 3시간 |\n| 학습 | 게시 48시간 뒤 성과로 잘 되는 조합을 점점 더 자주 선택. 상품 글/일반 글은 따로 비교 | 6시간 |\n| 회고 | AI가 잘 된 글과 안 된 글을 비교해 **글쓰기 규칙(플레이북)을 새로 쓰고 새 전략을 발명** | 매일 새벽 |\n| 일일 요약 | 어제 성과 + 상품 부족 시 \"이 키워드로 링크 추가해 주세요\" 안내 → `data/알림.txt` | 매일 오전 9시 |\n\n## 설치 — 관리앱으로 딸깍\n\n1. PC 브라우저(크롬 추천)로 **`쓰레드봇_관리앱.html`** 파일을 열기\n2. 화면 안내대로 깃허브 토큰 → 쓰레드 토큰·Claude 키 → 주제·말투 선택\n3. **딸깍, 설치하기** — 비공개 저장소 생성, 프로그램 설치, 키 암호화 등록, 연결 확인까지 자동\n\n이후 관리앱에서 전부 할 수 있어요: 켜기/끄기, 지금 올리기, 미리보기, 성과·AI 학습 현황, 상품 추가, 설정 변경, 키 교체.\n설정 탭 → **내 관리앱 주소 만들기**를 누르면 폰에서도 열 수 있는 주소가 생겨요.\n\n<details><summary>관리앱 없이 직접 설치하기 (고급)<\/summary>\n\n1. 깃허브에 **비공개** 저장소를 만들고 이 폴더 내용 전체(`.github` 포함)를 업로드\n2. Settings → Secrets and variables → Actions 에 `THREADS_ACCESS_TOKEN`, `ANTHROPIC_API_KEY` (선택: `THREADS_APP_SECRET`, `COUPANG_ACCESS_KEY`, `COUPANG_SECRET_KEY`) 등록\n3. Settings → Actions → General → Workflow permissions → Read and write\n4. Actions 탭 → threads-bot → Run workflow (command: `check`)\n<\/details>\n\n## 키 발급\n\n### 쓰레드 API 토큰\n1. developers.facebook.com → 앱 만들기 → 사용 사례 **\"Threads API 액세스\"**\n2. 권한: `threads_basic`, `threads_content_publish`, `threads_manage_insights`, `threads_manage_replies`, `threads_read_replies`, `threads_keyword_search`\n3. 앱 역할 → **Threads 테스터**에 내 계정 추가 → 쓰레드 앱 설정 > 계정 > 웹사이트 권한 > 초대 수락\n4. 사용 사례 설정 화면에서 토큰 생성(1시간짜리) → 60일짜리로 교환:\n   `https://graph.threads.net/access_token?grant_type=th_exchange_token&client_secret=앱시크릿&access_token=단기토큰`\n5. 결과의 `access_token`을 깃허브 Secret에 넣기. 이후 연장은 프로그램이 알아서 합니다.\n\n> 다른 사람 글 키워드 검색은 앱 검수가 필요할 수 있습니다. 검수 전엔 트렌드 스캔이 비어도 시즌·성과 기반으로 정상 동작합니다.\n\n### 쿠팡 파트너스 API (나중에)\n누적 판매 15만원 이상 → 최종승인 → 파트너스 사이트 **추가기능 → 쿠팡 파트너스 API**. 받으면 Secret 두 개만 추가하면 됩니다. 그때부터 상품 자동 탐색 + 주문까지 학습에 반영됩니다.\n\n## 알아둘 점\n- **비용**: 깃허브는 비공개 저장소도 월 2,000분 무료이고, 이 봇은 월 약 1,000~1,400분을 씁니다. Claude API는 하루 4글 + 답글 기준 월 수천 원 수준입니다.\n- **시간 오차**: 깃허브 예약 실행은 몇 분~수십 분 늦을 수 있습니다. 게시 시각이 조금씩 흔들리는 건 오히려 자연스럽습니다.\n- **광고 표기·허위후기 방지**는 끄지 마세요. 공정위 지침과 쿠팡 약관 위반 시 수익 몰수·탈퇴 사유입니다.\n- 처음 2주는 하루 3~4개를 유지하세요. 갑자기 많이 올리면 쓰레드가 계정을 제한할 수 있습니다.\n- 의미 있는 학습에는 보통 **2~4주**가 걸립니다.\n\n## 내 컴퓨터에서 테스트하고 싶다면 (선택)\n```bash\npip install -r requirements.txt\ncp .env.example .env    # 키 입력\npython main.py check\npython main.py preview\npython main.py simulate 100   # 키 없이 가짜 데이터로 학습 루프 테스트\n```\n", "settings.env": "# ===== 운영 설정 (비밀 아님, 깃허브 웹에서 연필 아이콘으로 바로 수정 가능) =====\n# 하루 게시 수 / 최소 간격(분)\nPOSTS_PER_DAY=4\nMIN_GAP_MINUTES=150\n# 광고 없는 일반 글 비율 (0.2~0.5 권장)\nCONTENT_RATIO=0.35\n# 같은 상품 재게시 금지 기간(일)\nPRODUCT_COOLDOWN_DAYS=10\n# 댓글 자동 답글\nAUTO_REPLY=true\nREPLIES_PER_DAY=20\n# 계정 주제와 말투\nNICHE=생활 꿀템, 자취템, 주방템, 육아템, 가성비 전자기기\nPERSONA=생활용품을 꼼꼼히 비교해보는 20~30대 큐레이터. 과장 없이 핵심만 말함.\nLLM_MODEL=claude-sonnet-4-5\nTIMEZONE=Asia/Seoul\n# true면 글만 만들고 게시하지 않음\nDRY_RUN=false\n", "products.csv": "name,price,url,image,category,keyword\n", "products.csv.example": "name,price,url,image,category,keyword\n규조토 발매트 대형,15900,https://link.coupang.com/a/여기에간편링크,,생활용품,발매트\n무선 음식물 처리기,129000,https://link.coupang.com/a/여기에간편링크,,주방용품,음식물 처리기\n", ".gitignore": ".env\n__pycache__/\n*.pyc\ndata/sim.db\n", ".env.example": "# 내 컴퓨터에서 테스트할 때만 사용. 이 파일을 .env로 복사해 채우세요.\n# (깃허브 자동 실행에서는 Settings > Secrets 에 같은 이름으로 넣습니다)\nTHREADS_ACCESS_TOKEN=\nANTHROPIC_API_KEY=\n# 쿠팡 API는 최종승인 후 발급 — 그 전엔 비워두고 products.csv 사용\nCOUPANG_ACCESS_KEY=\nCOUPANG_SECRET_KEY=\n", ".github/workflows/threads-bot.yml": "name: threads-bot\nrun-name: ${{ github.event.inputs.command || 'auto' }}\n\non:\n  schedule:\n    - cron: \"17 * * * *\"   # 매시간 17분 (깃허브 사정으로 몇 분~수십 분 늦어질 수 있음)\n  workflow_dispatch:        # Actions 탭에서 수동 실행\n    inputs:\n      command:\n        description: \"명령: cron / post / preview / learn / suggest / import / check / report\"\n        default: \"cron\"\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: threads-bot\n  cancel-in-progress: false\n\njobs:\n  run:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.11\"\n          cache: pip\n\n      - run: pip install -r requirements.txt\n\n      - name: 봇 실행\n        env:\n          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}\n          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}\n          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}\n        run: python main.py ${{ github.event.inputs.command || 'cron' }}\n\n      - name: 학습 데이터 저장\n        if: always()\n        run: |\n          git config user.name \"threads-bot\"\n          git config user.email \"threads-bot@users.noreply.github.com\"\n          git add -A data\n          git commit -m \"bot: 상태 업데이트\" || exit 0\n          git pull --rebase\n          git push\n", "data/.keep": "", "bot/__init__.py": "", "bot/config.py": "\"\"\"환경설정 로더 (.env)\"\"\"\nimport os\nfrom pathlib import Path\nfrom dotenv import load_dotenv\n\nROOT = Path(__file__).resolve().parent.parent\nload_dotenv(ROOT / \".env\")          # 비밀 키 (내 컴퓨터용, 깃허브에 올리지 않음)\nload_dotenv(ROOT / \"settings.env\")  # 운영 설정 (깃허브에서 바로 수정 가능). 이미 있는 값은 덮어쓰지 않음\n\n\ndef _get(name, default=None, cast=str):\n    v = os.getenv(name)\n    if v is None or v.strip() == \"\":\n        return default\n    try:\n        if cast is bool:\n            return v.strip().lower() in (\"1\", \"true\", \"yes\", \"y\", \"on\")\n        return cast(v.strip())\n    except ValueError:\n        return default\n\n\nclass Config:\n    # --- 쿠팡 파트너스 ---\n    COUPANG_ACCESS_KEY = _get(\"COUPANG_ACCESS_KEY\")\n    COUPANG_SECRET_KEY = _get(\"COUPANG_SECRET_KEY\")\n    COUPANG_SUB_ID = _get(\"COUPANG_SUB_ID\", \"threads\")\n    # 검색 API는 비공개 제한(시간당 약 8~10회)이 있어 보수적으로 설정. 3회 초과 위반 시 API 영구정지 사례 있음.\n    COUPANG_SEARCH_PER_HOUR = _get(\"COUPANG_SEARCH_PER_HOUR\", 6, int)\n\n    # --- 쓰레드 ---\n    THREADS_ACCESS_TOKEN = _get(\"THREADS_ACCESS_TOKEN\")\n    THREADS_USER_ID = _get(\"THREADS_USER_ID\", \"me\")\n    THREADS_APP_SECRET = _get(\"THREADS_APP_SECRET\")  # 선택: 단기 토큰 자동 교환용\n    THREADS_KEYWORD_SEARCH = _get(\"THREADS_KEYWORD_SEARCH\", True, bool)\n    THREADS_SEARCH_PER_DAY = _get(\"THREADS_SEARCH_PER_DAY\", 40, int)\n\n    # --- LLM (Claude) ---\n    ANTHROPIC_API_KEY = _get(\"ANTHROPIC_API_KEY\")\n    LLM_MODEL = _get(\"LLM_MODEL\", \"claude-sonnet-4-5\")\n\n    # --- 운영 ---\n    POSTS_PER_DAY = _get(\"POSTS_PER_DAY\", 4, int)\n    MIN_GAP_MINUTES = _get(\"MIN_GAP_MINUTES\", 150, int)\n    PRODUCT_COOLDOWN_DAYS = _get(\"PRODUCT_COOLDOWN_DAYS\", 10, int)\n    # 광고 없는 일반 글 비율 (팔로워·도달 확보용). 0.2~0.5 권장\n    CONTENT_RATIO = _get(\"CONTENT_RATIO\", 0.35, float)\n    # 댓글 자동 답글\n    AUTO_REPLY = _get(\"AUTO_REPLY\", True, bool)\n    REPLIES_PER_DAY = _get(\"REPLIES_PER_DAY\", 20, int)\n    DAILY_REPORT_HOUR = _get(\"DAILY_REPORT_HOUR\", 9, int)\n    TIMEZONE = _get(\"TIMEZONE\", \"Asia/Seoul\")\n    NICHE = _get(\"NICHE\", \"생활 꿀템, 자취템, 주방템, 육아템, 가성비 전자기기\")\n    PERSONA = _get(\"PERSONA\", \"생활용품을 꼼꼼히 비교해보는 20~30대 큐레이터. 과장 없이 핵심만 말함.\")\n    DRY_RUN = _get(\"DRY_RUN\", False, bool)  # True면 실제 게시 안 함\n    # 광고 표기: 공정위 추천·보증 심사지침 + 쿠팡 파트너스 약관상 필수. 끄지 마세요.\n    DISCLOSURE = _get(\n        \"DISCLOSURE\",\n        \"이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.\",\n    )\n    SHORT_DISCLOSURE = _get(\"SHORT_DISCLOSURE\", \"(광고·쿠팡파트너스)\")\n\n    # 시뮬레이션(쓰레드 토큰 없음)은 별도 DB를 써서 실제 학습 데이터와 섞이지 않게 함\n    DB_PATH = _get(\"DB_PATH\", str(ROOT / \"data\" / (\"sim.db\" if not _get(\"THREADS_ACCESS_TOKEN\") else \"bot.db\")))\n    MANUAL_PRODUCTS_CSV = _get(\"MANUAL_PRODUCTS_CSV\", str(ROOT / \"products.csv\"))\n\n    @classmethod\n    def has_coupang(cls):\n        return bool(cls.COUPANG_ACCESS_KEY and cls.COUPANG_SECRET_KEY)\n\n    @classmethod\n    def has_threads(cls):\n        return bool(cls.THREADS_ACCESS_TOKEN)\n\n    @classmethod\n    def has_llm(cls):\n        return bool(cls.ANTHROPIC_API_KEY)\n\n    @classmethod\n    def simulate(cls):\n        \"\"\"쓰레드 토큰이 없으면 시뮬레이션 모드(가짜 게시·가짜 지표)로 전체 루프를 돌림\"\"\"\n        return not cls.has_threads()\n", "bot/coupang.py": "\"\"\"쿠팡 파트너스 Open API 클라이언트 (HMAC 서명) + 수동 CSV 모드 + 시뮬레이션 모드\"\"\"\nimport csv\nimport hashlib\nimport hmac\nimport random\nimport re\nimport time\nfrom pathlib import Path\nfrom urllib.parse import urlencode\n\nimport requests\n\nfrom .config import Config\n\nDOMAIN = \"https://api-gateway.coupang.com\"\nBASE = \"/v2/providers/affiliate_open_api/apis/openapi/v1\"\n\n# 베스트 카테고리 ID (쿠팡 파트너스 API 기준)\nCATEGORIES = {\n    1001: \"여성패션\", 1002: \"남성패션\", 1010: \"뷰티\", 1011: \"출산/유아동\", 1012: \"식품\",\n    1013: \"주방용품\", 1014: \"생활용품\", 1015: \"홈인테리어\", 1016: \"가전디지털\",\n    1017: \"스포츠/레저\", 1018: \"자동차용품\", 1019: \"도서/음반/DVD\", 1020: \"완구/취미\",\n    1021: \"문구/오피스\", 1024: \"헬스/건강식품\", 1025: \"국내여행\", 1026: \"해외여행\",\n    1029: \"반려동물용품\", 1030: \"유아동패션\",\n}\n\n\nclass CoupangError(Exception):\n    pass\n\n\nclass Coupang:\n    def __init__(self, db):\n        self.db = db\n        self.live = Config.has_coupang()\n\n    # ---------- 저수준 ----------\n    def _auth(self, method, path, query):\n        signed_date = time.strftime(\"%y%m%dT%H%M%SZ\", time.gmtime())\n        msg = signed_date + method + path + query\n        sig = hmac.new(Config.COUPANG_SECRET_KEY.encode(), msg.encode(), hashlib.sha256).hexdigest()\n        return (f\"CEA algorithm=HmacSHA256, access-key={Config.COUPANG_ACCESS_KEY}, \"\n                f\"signed-date={signed_date}, signature={sig}\")\n\n    def _req(self, method, path, params=None, body=None, api=\"coupang\"):\n        query = urlencode(params or {})\n        url = DOMAIN + path + (\"?\" + query if query else \"\")\n        headers = {\"Authorization\": self._auth(method, path, query),\n                   \"Content-Type\": \"application/json;charset=UTF-8\"}\n        self.db.record_call(api)\n        r = requests.request(method, url, headers=headers, json=body, timeout=20)\n        if r.status_code == 429 or r.status_code == 403:\n            raise CoupangError(f\"{api} 호출 제한/권한 오류 {r.status_code}: {r.text[:200]}\")\n        r.raise_for_status()\n        j = r.json()\n        if str(j.get(\"rCode\", \"0\")) != \"0\":\n            raise CoupangError(f\"{api} 오류: {j.get('rMessage')}\")\n        return j.get(\"data\")\n\n    @staticmethod\n    def _norm(d, source, keyword=None, category=None):\n        return {\n            \"product_id\": str(d.get(\"productId\")),\n            \"name\": d.get(\"productName\", \"\"),\n            \"price\": int(d.get(\"productPrice\") or 0),\n            \"image\": d.get(\"productImage\"),\n            \"url\": d.get(\"productUrl\"),  # 이미 파트너스 추적 링크\n            \"category\": d.get(\"categoryName\") or category,\n            \"source\": source,\n            \"keyword\": keyword or d.get(\"keyword\"),\n            \"is_rocket\": 1 if d.get(\"isRocket\") else 0,\n            \"rank\": d.get(\"rank\"),\n        }\n\n    # ---------- 공개 메서드 ----------\n    def search_budget_left(self):\n        return Config.COUPANG_SEARCH_PER_HOUR - self.db.calls_since(\"coupang_search\", 3600)\n\n    def search(self, keyword, limit=10):\n        if not self.live:\n            return self._manual_or_mock(keyword=keyword)\n        if self.search_budget_left() <= 0:\n            raise CoupangError(\"검색 API 시간당 예산 소진 — 다음 사이클로 미룸\")\n        data = self._req(\"GET\", f\"{BASE}/products/search\",\n                         {\"keyword\": keyword, \"limit\": limit, \"subId\": Config.COUPANG_SUB_ID, \"imageSize\": \"512x512\"},\n                         api=\"coupang_search\")\n        items = (data or {}).get(\"productData\", []) if isinstance(data, dict) else (data or [])\n        return [self._norm(d, \"search\", keyword=keyword) for d in items]\n\n    def goldbox(self):\n        if not self.live:\n            return self._manual_or_mock()\n        data = self._req(\"GET\", f\"{BASE}/products/goldbox\",\n                         {\"subId\": Config.COUPANG_SUB_ID, \"imageSize\": \"512x512\"}, api=\"coupang_goldbox\")\n        return [self._norm(d, \"goldbox\") for d in (data or [])]\n\n    def best_category(self, cat_id, limit=20):\n        if not self.live:\n            return self._manual_or_mock(category=CATEGORIES.get(cat_id))\n        data = self._req(\"GET\", f\"{BASE}/products/bestcategories/{cat_id}\",\n                         {\"limit\": limit, \"subId\": Config.COUPANG_SUB_ID, \"imageSize\": \"512x512\"},\n                         api=\"coupang_best\")\n        return [self._norm(d, \"best\", category=CATEGORIES.get(cat_id)) for d in (data or [])]\n\n    def deeplink(self, urls):\n        if not self.live:\n            return {u: u for u in urls}\n        data = self._req(\"POST\", f\"{BASE}/deeplink\", body={\"coupangUrls\": urls, \"subId\": Config.COUPANG_SUB_ID},\n                         api=\"coupang_deeplink\")\n        return {d[\"originalUrl\"]: d.get(\"shortenUrl\") or d.get(\"landingUrl\") for d in (data or [])}\n\n    def orders(self, start, end):\n        \"\"\"주문 리포트 (yyyyMMdd). productId 단위로 게시물에 수익을 귀속시키는 데 사용.\"\"\"\n        if not self.live:\n            return []\n        out, page = [], 0\n        while page < 20:\n            data = self._req(\"GET\", f\"{BASE}/reports/orders\",\n                             {\"startDate\": start, \"endDate\": end, \"subId\": Config.COUPANG_SUB_ID, \"page\": page},\n                             api=\"coupang_report\")\n            if not data:\n                break\n            out.extend(data)\n            if len(data) < 1000:\n                break\n            page += 1\n        return out\n\n    # ---------- API 키가 없을 때 ----------\n    def _manual_or_mock(self, keyword=None, category=None):\n        p = Path(Config.MANUAL_PRODUCTS_CSV)\n        if p.exists():\n            rows = []\n            with open(p, encoding=\"utf-8-sig\") as f:\n                for i, r in enumerate(csv.DictReader(f)):\n                    url = (r.get(\"url\") or \"\").strip()\n                    if not url.startswith(\"http\") or \"여기에\" in url or not (r.get(\"name\") or \"\").strip():\n                        continue  # 빈 줄·예시 줄 무시\n                    rows.append({\n                        \"product_id\": r.get(\"product_id\") or \"manual-\" + hashlib.md5(r[\"url\"].strip().encode()).hexdigest()[:12],\n                        \"name\": r.get(\"name\", \"\"),\n                        \"price\": int(re.sub(r\"[^0-9]\", \"\", r.get(\"price\") or \"\") or 0),\n                        \"image\": r.get(\"image\") or None, \"url\": r[\"url\"].strip(),\n                        \"category\": r.get(\"category\") or category, \"source\": \"manual\",\n                        \"keyword\": r.get(\"keyword\") or None, \"is_rocket\": 0, \"rank\": None,\n                    })\n            if rows or not Config.simulate():\n                return rows\n        # 시뮬레이션용 가짜 상품\n        names = [\"무선 핸디 청소기\", \"스테인리스 에어프라이어 용기\", \"접이식 빨래건조대\", \"USB-C 고속충전 케이블 3팩\",\n                 \"아기 실리콘 턱받이\", \"자취생 전기 멀티쿠커\", \"고양이 자동 급수기\", \"캠핑용 LED 랜턴\",\n                 \"수납 압축팩 10매\", \"휴대용 목선풍기\"]\n        rnd = random.Random(keyword or category or \"x\")\n        picks = rnd.sample(names, 5)\n        return [{\"product_id\": \"mock-\" + hashlib.md5(n.encode()).hexdigest()[:8], \"name\": n, \"price\": rnd.randint(9, 89) * 1000,\n                 \"image\": \"https://picsum.photos/seed/\" + hashlib.md5(n.encode()).hexdigest()[:6] + \"/512\", \"url\": \"https://link.coupang.com/a/mock\" + hashlib.md5(n.encode()).hexdigest()[:6],\n                 \"category\": category or \"생활용품\", \"source\": \"mock\", \"keyword\": keyword,\n                 \"is_rocket\": 1, \"rank\": i + 1} for i, n in enumerate(picks)]\n", "bot/db.py": "\"\"\"SQLite 저장소: 상품, 게시물, 성과, 전략 학습 상태, 플레이북\"\"\"\nimport json\nimport sqlite3\nimport time\nfrom pathlib import Path\n\nfrom .config import Config\n\nSCHEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS products (\n    product_id TEXT PRIMARY KEY,\n    name TEXT, price INTEGER, image TEXT, url TEXT,\n    category TEXT, source TEXT, keyword TEXT,\n    is_rocket INTEGER DEFAULT 0, rank INTEGER,\n    score REAL DEFAULT 0, found_at REAL, last_posted_at REAL\n);\nCREATE TABLE IF NOT EXISTS keywords (\n    keyword TEXT PRIMARY KEY,\n    origin TEXT, reason TEXT,\n    alpha REAL DEFAULT 1, beta REAL DEFAULT 1,\n    uses INTEGER DEFAULT 0, created_at REAL, last_searched_at REAL\n);\nCREATE TABLE IF NOT EXISTS posts (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n    threads_id TEXT, reply_id TEXT, permalink TEXT,\n    product_id TEXT, keyword TEXT, category TEXT,\n    arms TEXT, text TEXT, reply_text TEXT,\n    posted_at REAL, simulated INTEGER DEFAULT 0,\n    views INTEGER DEFAULT 0, likes INTEGER DEFAULT 0, replies INTEGER DEFAULT 0,\n    reposts INTEGER DEFAULT 0, quotes INTEGER DEFAULT 0, shares INTEGER DEFAULT 0,\n    orders INTEGER DEFAULT 0, commission REAL DEFAULT 0,\n    metrics_at REAL, score REAL, reward REAL, learned INTEGER DEFAULT 0\n);\nCREATE TABLE IF NOT EXISTS arms (\n    dimension TEXT, arm TEXT, description TEXT,\n    alpha REAL DEFAULT 1, beta REAL DEFAULT 1, pulls INTEGER DEFAULT 0,\n    active INTEGER DEFAULT 1, origin TEXT DEFAULT 'seed', created_at REAL,\n    PRIMARY KEY (dimension, arm)\n);\nCREATE TABLE IF NOT EXISTS playbook (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n    created_at REAL, content TEXT\n);\nCREATE TABLE IF NOT EXISTS trends (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n    created_at REAL, query TEXT, text TEXT, permalink TEXT\n);\nCREATE TABLE IF NOT EXISTS api_calls (\n    api TEXT, at REAL\n);\nCREATE TABLE IF NOT EXISTS replied (\n    comment_id TEXT PRIMARY KEY, post_id INTEGER, at REAL, comment TEXT, reply TEXT\n);\nCREATE TABLE IF NOT EXISTS kv (k TEXT PRIMARY KEY, v TEXT);\nCREATE TABLE IF NOT EXISTS logs (at REAL, level TEXT, msg TEXT);\n\"\"\"\n\n\nclass DB:\n    def __init__(self, path=None):\n        path = path or Config.DB_PATH\n        Path(path).parent.mkdir(parents=True, exist_ok=True)\n        self.conn = sqlite3.connect(path, timeout=30)\n        self.conn.row_factory = sqlite3.Row\n        self.conn.executescript(SCHEMA)\n        # 구버전 DB 마이그레이션\n        cols = {r[1] for r in self.conn.execute(\"PRAGMA table_info(posts)\")}\n        for col, ddl in ((\"post_type\", \"TEXT DEFAULT 'product'\"), (\"clicks\", \"INTEGER DEFAULT 0\")):\n            if col not in cols:\n                self.conn.execute(f\"ALTER TABLE posts ADD COLUMN {col} {ddl}\")\n        self.conn.commit()\n        self._last_alert = {}\n\n    # ---- 범용 ----\n    def q(self, sql, args=()):\n        return [dict(r) for r in self.conn.execute(sql, args).fetchall()]\n\n    def one(self, sql, args=()):\n        r = self.conn.execute(sql, args).fetchone()\n        return dict(r) if r else None\n\n    def x(self, sql, args=()):\n        cur = self.conn.execute(sql, args)\n        self.conn.commit()\n        return cur.lastrowid\n\n    def kv_get(self, k, default=None):\n        r = self.one(\"SELECT v FROM kv WHERE k=?\", (k,))\n        return json.loads(r[\"v\"]) if r else default\n\n    def kv_set(self, k, v):\n        self.x(\"INSERT OR REPLACE INTO kv(k,v) VALUES(?,?)\", (k, json.dumps(v, ensure_ascii=False)))\n\n    def log(self, msg, level=\"INFO\"):\n        print(f\"[{time.strftime('%m-%d %H:%M:%S')}] {level} {msg}\", flush=True)\n        self.x(\"INSERT INTO logs VALUES(?,?,?)\", (time.time(), level, msg))\n        if level == \"ERROR\":\n            key = msg[:40]\n            if time.time() - self._last_alert.get(key, 0) > 3600:  # 같은 오류는 1시간에 한 번만\n                self._last_alert[key] = time.time()\n                from .notify import send\n                send(f\"⚠️ 오류\\n{msg[:500]}\")\n\n    # ---- API 호출 예산 ----\n    def record_call(self, api):\n        self.x(\"INSERT INTO api_calls VALUES(?,?)\", (api, time.time()))\n\n    def calls_since(self, api, seconds):\n        r = self.one(\"SELECT COUNT(*) c FROM api_calls WHERE api=? AND at>?\", (api, time.time() - seconds))\n        return r[\"c\"]\n\n    # ---- 상품 ----\n    def upsert_product(self, p):\n        self.x(\n            \"\"\"INSERT INTO products(product_id,name,price,image,url,category,source,keyword,is_rocket,rank,score,found_at)\n               VALUES(:product_id,:name,:price,:image,:url,:category,:source,:keyword,:is_rocket,:rank,:score,:found_at)\n               ON CONFLICT(product_id) DO UPDATE SET\n                 name=excluded.name, price=excluded.price, image=excluded.image, url=excluded.url,\n                 category=COALESCE(excluded.category, products.category),\n                 keyword=COALESCE(excluded.keyword, products.keyword),\n                 rank=excluded.rank, score=MAX(products.score, excluded.score), found_at=excluded.found_at\"\"\",\n            {\"is_rocket\": 0, \"rank\": None, \"score\": 0, \"found_at\": time.time(), \"keyword\": None,\n             \"category\": None, **p},\n        )\n\n    def latest_playbook(self):\n        r = self.one(\"SELECT content FROM playbook ORDER BY id DESC LIMIT 1\")\n        return r[\"content\"] if r else \"\"\n", "bot/engine.py": "\"\"\"오케스트레이터: 탐색 → 작성 → 게시 → 수집 → 학습 루프와 일정 관리\"\"\"\nimport datetime as dt\nimport json\nimport random\nimport time\nfrom zoneinfo import ZoneInfo\n\nfrom . import writer\nfrom .config import Config\nfrom .coupang import Coupang\nfrom .db import DB\nfrom .explorer import Explorer\nfrom .learner import Learner\nfrom .notify import send\nfrom .replier import Replier\nfrom .strategy import Strategy\nfrom .threads import Threads, ThreadsError\n\nTZ = ZoneInfo(Config.TIMEZONE)\n\n\nclass Engine:\n    def __init__(self):\n        self.db = DB()\n        self.cp = Coupang(self.db)\n        self.th = Threads(self.db)\n        self.st = Strategy(self.db)\n        self.ex = Explorer(self.db, self.cp, self.th)\n        self.lr = Learner(self.db, self.th, self.cp, self.st)\n        self.rp = Replier(self.db, self.th)\n        self.previews = []  # 미리보기 결과 (관리앱 표시용)\n        if not self.th.sim and self.th.user_id == \"me\":\n            try:\n                self.th.me()  # 숫자 user_id 확보\n            except ThreadsError as e:\n                self.db.log(f\"쓰레드 계정 조회 실패(토큰 확인 필요): {e}\", \"ERROR\")\n\n    # ---------------- 게시 ----------------\n    def post_once(self, time_slot=None, force_type=None):\n        post_type = force_type or (\"content\" if random.random() < Config.CONTENT_RATIO else \"product\")\n        product = None\n        if post_type == \"product\":\n            product = self.ex.pick_product()\n            if not product:\n                self.discover()\n                product = self.ex.pick_product()\n            if not product:\n                self.db.log(\"게시할 상품이 없어 일반 글로 대체 — products.csv에 상품을 추가하세요\", \"WARN\")\n                post_type = \"content\"\n        if post_type == \"content\":\n            return self._post_content(time_slot)\n        return self._post_product(product, time_slot)\n\n    def _recent(self):\n        return [r[\"text\"] for r in self.db.q(\n            \"SELECT text FROM posts WHERE post_type!='history' ORDER BY posted_at DESC LIMIT 8\")]\n\n    def _post_content(self, time_slot):\n        arms = self.st.choose_content(time_slot)\n        draft = writer.generate_content(arms, self.st.descriptions(arms), self.db.latest_playbook(),\n                                        self._recent(), self.ex.trend_samples())\n        text = draft[\"main\"].strip()[:500]\n        if Config.DRY_RUN:\n            print(\"\\n===== DRY RUN · 일반 글 (게시 안 함) =====\\n전략:\", arms, \"\\n\" + text)\n            self.previews.append({\"type\": \"content\", \"arms\": arms, \"product\": None,\n                                  \"pieces\": [{\"role\": \"main\", \"text\": text}]})\n            return None\n        try:\n            mid = self.th.post(text, topic_tag=draft.get(\"topic_tag\"))\n        except ThreadsError as e:\n            self.db.log(f\"게시 실패: {e}\", \"ERROR\")\n            return None\n        pid = self._save(mid, None, None, arms, text, None, \"content\")\n        self.db.log(f\"일반 글 게시 #{pid}: {text[:30]!r} | {arms}\")\n        return pid\n\n    def _post_product(self, product, time_slot):\n        arms = self.st.choose(time_slot)\n        if arms[\"format\"] == \"image_post\" and not product.get(\"image\"):\n            arms[\"format\"] = self.st.sample(\"format\", exclude=(\"image_post\",))[\"arm\"]\n\n        link = product[\"url\"]\n        if \"link.coupang.com\" not in (link or \"\") and self.cp.live:\n            link = self.cp.deeplink([link]).get(link, link)\n\n        draft = writer.generate(product, arms, self.st.descriptions(arms), self.db.latest_playbook(), self._recent())\n        pieces = writer.compose(draft, link, arms)\n\n        if Config.DRY_RUN:\n            print(\"\\n===== DRY RUN · 상품 글 (게시 안 함) =====\")\n            print(\"상품:\", product[\"name\"], product.get(\"price\"), \"| 전략:\", arms)\n            for p in pieces:\n                print(f\"--- [{p['role']}] ---\\n{p['text']}\")\n            self.previews.append({\"type\": \"product\", \"arms\": arms,\n                                  \"product\": {k: product.get(k) for k in (\"name\", \"price\", \"image\", \"url\", \"keyword\")},\n                                  \"pieces\": [{\"role\": p[\"role\"], \"text\": p[\"text\"]} for p in pieces]})\n            return None\n\n        try:\n            main = pieces[0]\n            image = product.get(\"image\") if arms[\"format\"] == \"image_post\" else None\n            main_id = self.th.post(main[\"text\"], image_url=image, topic_tag=draft.get(\"topic_tag\"),\n                                   link=main.get(\"link\") if not image else None)\n            reply_id = None\n            for p in pieces[1:]:\n                time.sleep(random.uniform(20, 60) if not self.th.sim else 0)\n                rid = self.th.post(p[\"text\"], reply_to=main_id, link=p.get(\"link\"))\n                if p[\"role\"] == \"link_reply\":\n                    reply_id = rid\n        except ThreadsError as e:\n            self.db.log(f\"게시 실패: {e}\", \"ERROR\")\n            return None\n\n        pid = self._save(main_id, reply_id, product, arms,\n                         \"\\n\\n\".join(p[\"text\"] for p in pieces if p[\"role\"] != \"link_reply\"),\n                         next((p[\"text\"] for p in pieces if p[\"role\"] == \"link_reply\"), None), \"product\")\n        self.db.x(\"UPDATE products SET last_posted_at=? WHERE product_id=?\", (time.time(), product[\"product_id\"]))\n        self.db.log(f\"상품 글 게시 #{pid}: {product['name'][:30]} | {arms}\")\n        return pid\n\n    def _save(self, main_id, reply_id, product, arms, text, reply_text, post_type):\n        product = product or {}\n        return self.db.x(\n            \"\"\"INSERT INTO posts(threads_id,reply_id,permalink,product_id,keyword,category,arms,text,reply_text,\n                                 posted_at,simulated,post_type) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)\"\"\",\n            (main_id, reply_id, self.th.permalink(main_id), product.get(\"product_id\"), product.get(\"keyword\"),\n             product.get(\"category\"), json.dumps(arms, ensure_ascii=False), text, reply_text,\n             time.time(), 1 if self.th.sim else 0, post_type))\n\n    # ---------------- 탐색 ----------------\n    def discover(self):\n        last = self.db.kv_get(\"last_trend_scan\", 0)\n        if time.time() - last > 12 * 3600:\n            self.ex.scan_trends()\n            self.ex.generate_keywords()\n            self.db.kv_set(\"last_trend_scan\", time.time())\n            if not self.cp.live:\n                self.ex.write_suggestions()\n        self.ex.collect_products()\n\n    # ---------------- 일일 요약 알림 ----------------\n    def daily_summary(self):\n        since = time.time() - 86400\n        s = self.db.one(\"\"\"SELECT COUNT(*) n, SUM(views) v, SUM(likes) l, SUM(replies) r,\n                           SUM(post_type='product') np, SUM(post_type='content') nc\n                           FROM posts WHERE posted_at>? AND post_type!='history'\"\"\", (since,))\n        top = self.db.one(\"\"\"SELECT text, views, likes FROM posts WHERE posted_at>? AND post_type!='history'\n                             ORDER BY views DESC LIMIT 1\"\"\", (since - 2 * 86400,))\n        rep = self.db.one(\"SELECT COUNT(*) c FROM replied WHERE at>? AND reply IS NOT NULL\", (since,))[\"c\"]\n        avail = self.ex.available_count()\n        msg = [f\"📊 어제 요약 ({'시뮬' if self.th.sim else '실제'})\",\n               f\"게시 {s['n'] or 0}개 (상품 {s['np'] or 0} / 일반 {s['nc'] or 0}) · 답글 {rep}개\",\n               f\"(최근 글 누적) 조회 {s['v'] or 0:,} · 좋아요 {s['l'] or 0} · 댓글 {s['r'] or 0}\"]\n        if top:\n            msg.append(f\"🔥 최근 3일 최고: 조회 {top['views']:,}\\n{(top['text'] or '')[:80]}\")\n        pb = self.db.latest_playbook()\n        if pb:\n            msg.append(\"🧠 현재 플레이북 앞부분\\n\" + pb[:300])\n        if not self.cp.live:\n            msg.append(f\"📦 게시 가능한 상품 {avail}개\")\n            if avail < Config.POSTS_PER_DAY * 3:\n                sug = self.ex.suggestions(5)\n                msg.append(\"⚠️ 상품이 부족해요. AI 추천 키워드로 간편링크를 만들어 products.csv에 추가해 주세요:\\n\"\n                           + \"\\n\".join(f\"• {r['keyword']} — {r['reason']}\\n  {r['search_url']}\" for r in sug))\n        send(\"\\n\\n\".join(msg))\n        __import__(\"bot.report\", fromlist=[\"build\"]).build(self)  # 리포트도 매일 갱신\n\n    # ---------------- 하루 일정 ----------------\n    def plan_day(self, day):\n        key = f\"plan_{day:%Y%m%d}\"\n        plan = self.db.kv_get(key)\n        if plan:\n            return plan\n        slots, times = [], []\n        for _ in range(Config.POSTS_PER_DAY * 4):\n            if len(times) >= Config.POSTS_PER_DAY:\n                break\n            slot = self.st.sample(\"time_slot\")[\"arm\"]\n            h0, h1 = map(int, slot.split(\"-\"))\n            t = dt.datetime.combine(day, dt.time(h0), TZ) + dt.timedelta(minutes=random.randint(0, (h1 - h0) * 60 - 1))\n            if all(abs((t - x).total_seconds()) >= Config.MIN_GAP_MINUTES * 60 for x in times):\n                times.append(t); slots.append(slot)\n        plan = sorted([{\"ts\": t.timestamp(), \"slot\": s, \"done\": False} for t, s in zip(times, slots)],\n                      key=lambda x: x[\"ts\"])\n        self.db.kv_set(key, plan)\n        self.db.log(\"오늘 게시 일정: \" + \", \".join(\n            f\"{dt.datetime.fromtimestamp(p['ts'], TZ):%H:%M}({p['slot']})\" for p in plan))\n        return plan\n\n    # ---------------- 메인 루프 ----------------\n    def tick(self):\n        now = dt.datetime.now(TZ)\n        key = f\"plan_{now.date():%Y%m%d}\"\n        plan = self.plan_day(now.date())\n        # 예약 실행이 늦게 돌아도 놓친 게시는 한 번에 1개씩만 (몰아서 올리면 스팸처럼 보임)\n        for item in plan:\n            if not item[\"done\"] and item[\"ts\"] <= now.timestamp() < item[\"ts\"] + 3 * 3600:\n                item[\"done\"] = True\n                self.db.kv_set(key, plan)\n                self.post_once(item[\"slot\"])\n                break\n            if not item[\"done\"] and now.timestamp() >= item[\"ts\"] + 3 * 3600:\n                item[\"done\"] = True  # 너무 늦은 건 건너뜀\n                self.db.kv_set(key, plan)\n\n        def every(name, sec, fn):\n            # 1시간 간격 예약 실행의 오차를 흡수하려고 10분 여유\n            if time.time() - self.db.kv_get(f\"last_{name}\", 0) > sec - 600:\n                try:\n                    fn()\n                except Exception as e:  # 한 단계 실패가 전체 루프를 멈추지 않도록\n                    self.db.log(f\"{name} 실패: {e}\", \"ERROR\")\n                self.db.kv_set(f\"last_{name}\", time.time())\n\n        every(\"discover\", 2 * 3600, self.discover)\n        every(\"collect\", 3 * 3600, self.lr.collect)\n        every(\"reply\", 3600, self.rp.run)\n        every(\"learn\", 6 * 3600, self.lr.learn)\n        # 예약 실행(1시간 간격, 지연 가능)에서도 빠지지 않도록 '해당 시각 이후 하루 1회'로 판단\n        if now.hour >= 4:\n            every(\"reflect\", 20 * 3600, self.lr.reflect)\n        if now.hour >= Config.DAILY_REPORT_HOUR:\n            every(\"summary\", 20 * 3600, self.daily_summary)\n        every(\"decay\", 7 * 86400, self.st.decay)\n        every(\"refresh_token\", 6 * 86400, self.th.refresh_token)\n\n    def run_forever(self, interval=300):\n        mode = \"시뮬레이션\" if self.th.sim else \"실제\"\n        self.db.log(f\"자동화 시작 — {mode} 모드, 하루 {Config.POSTS_PER_DAY}개 게시 (일반 글 {Config.CONTENT_RATIO:.0%})\")\n        if not self.th.sim:\n            me = self.th.me()\n            self.db.log(f\"쓰레드 계정 연결: @{me.get('username')}\")\n        send(f\"▶️ 자동화 시작 ({mode} 모드)\")\n        while True:\n            try:\n                self.tick()\n            except Exception as e:\n                self.db.log(f\"tick 오류: {e}\", \"ERROR\")\n            time.sleep(interval)\n", "bot/explorer.py": "\"\"\"탐색기: 트렌드 파악 → 검색 키워드 생성 → 상품 수집 → 상품 점수화 → 게시할 상품 선택\"\"\"\nimport datetime as dt\nimport math\nimport random\nimport time\nfrom urllib.parse import quote\n\nfrom . import llm\nfrom .config import Config\nfrom .coupang import CATEGORIES, CoupangError\n\nSEASONAL = {\n    1: [\"신년 다이어리\", \"가습기\", \"전기요\", \"설 선물세트\"], 2: [\"졸업 선물\", \"신학기 준비물\", \"봄맞이 정리함\"],\n    3: [\"신학기 가방\", \"미세먼지 마스크\", \"공기청정기 필터\"], 4: [\"캠핑 의자\", \"자외선 차단제\", \"이사 정리용품\"],\n    5: [\"어버이날 선물\", \"어린이날 선물\", \"피크닉 매트\"], 6: [\"선풍기\", \"제습기\", \"여름 냉감 이불\"],\n    7: [\"휴대용 선풍기\", \"물놀이 용품\", \"모기 퇴치기\"], 8: [\"여름휴가 준비물\", \"쿨매트\", \"개학 준비물\"],\n    9: [\"추석 선물세트\", \"환절기 이불\", \"가을 캠핑\"], 10: [\"가습기\", \"핼러윈 소품\", \"전기포트\"],\n    11: [\"블랙프라이데이\", \"수능 선물\", \"온수매트\", \"김장 용품\"], 12: [\"크리스마스 선물\", \"연말 파티 용품\", \"방한 용품\"],\n}\n\n# 니치 키워드 → 베스트 카테고리 매핑 (대략)\nNICHE_CAT = {\"주방\": 1013, \"생활\": 1014, \"자취\": 1014, \"육아\": 1011, \"아기\": 1011, \"전자\": 1016, \"가전\": 1016,\n             \"뷰티\": 1010, \"화장품\": 1010, \"반려\": 1029, \"강아지\": 1029, \"고양이\": 1029, \"캠핑\": 1017,\n             \"운동\": 1017, \"인테리어\": 1015, \"식품\": 1012, \"건강\": 1024, \"문구\": 1021, \"자동차\": 1018}\n\n\nclass Explorer:\n    def __init__(self, db, coupang, threads):\n        self.db, self.cp, self.th = db, coupang, threads\n\n    # ---------------- 1. 트렌드 ----------------\n    def scan_trends(self):\n        seeds = [s.strip() for s in Config.NICHE.split(\",\") if s.strip()]\n        queries = []\n        for s in seeds:\n            queries += [s, f\"{s} 추천\"]\n        queries += [\"살까 말까\", \"이거 사길 잘했다\", \"쿠팡 추천템\", \"내돈내산\"]\n        random.shuffle(queries)\n        found = 0\n        for q in queries[:8]:\n            for p in self.th.keyword_search(q, \"TOP\", limit=25):\n                if p.get(\"text\"):\n                    self.db.x(\"INSERT INTO trends(created_at,query,text,permalink) VALUES(?,?,?,?)\",\n                              (time.time(), q, p[\"text\"][:600], p.get(\"permalink\")))\n                    found += 1\n        self.db.log(f\"트렌드 스캔: 쓰레드 인기글 {found}개 수집\")\n        return found\n\n    def generate_keywords(self):\n        now = dt.datetime.now()\n        season = SEASONAL.get(now.month, []) + SEASONAL.get(now.month % 12 + 1, [])[:2]\n        trends = self.db.q(\"SELECT query,text FROM trends WHERE created_at>? ORDER BY RANDOM() LIMIT 40\",\n                           (time.time() - 3 * 86400,))\n        good = self.db.q(\"SELECT keyword, alpha/(alpha+beta) m FROM keywords WHERE uses>=2 ORDER BY m DESC LIMIT 8\")\n        bad = self.db.q(\"SELECT keyword, alpha/(alpha+beta) m FROM keywords WHERE uses>=3 ORDER BY m ASC LIMIT 5\")\n        playbook = self.db.latest_playbook()\n\n        result = llm.ask_json(\n            \"너는 쿠팡 파트너스 제휴마케터의 상품 리서처다. 한국 쓰레드(Threads) 사용자들이 지금 관심 갖고, \"\n            \"실제로 구매로 이어질 만한 상품 검색 키워드를 찾는다.\",\n            f\"\"\"오늘: {now:%Y-%m-%d} ({['월','화','수','목','금','토','일'][now.weekday()]}요일)\n계정 니치: {Config.NICHE}\n시즌 힌트: {', '.join(season)}\n최근 성과 좋은 키워드: {good}\n성과 나쁜 키워드(피할 것): {bad}\n현재 플레이북 요약:\n{playbook[:1500]}\n\n쓰레드 인기글 샘플(사람들이 실제로 말하는 고민/관심사):\n{chr(10).join('- [' + t['query'] + '] ' + t['text'][:200].replace(chr(10), ' ') for t in trends) or '(없음)'}\n\n위 정보를 근거로 쿠팡에서 검색할 상품 키워드 8개를 제안해라.\n- 너무 넓은 단어(예: '가전') 말고 구체적인 상품명 수준 (예: '무선 음식물 처리기', '규조토 발매트')\n- 70%는 성과 좋은 방향 활용, 30%는 새로운 탐색\n- 의료기기·건강기능식품 효능 주장이 필요한 상품, 성인용품, 주류·담배 제외\n형식: {{\"keywords\":[{{\"keyword\":\"...\",\"reason\":\"한 줄 근거\",\"type\":\"exploit|explore\"}}]}}\"\"\",\n            temperature=0.9,\n        )\n        if result is None:  # LLM 없음 → 시즌 + 니치 규칙 기반\n            base = season + [s.strip() + \" 추천\" for s in Config.NICHE.split(\",\")]\n            result = {\"keywords\": [{\"keyword\": k, \"reason\": \"규칙 기반\", \"type\": \"explore\"} for k in base[:8]]}\n        added = 0\n        for k in result.get(\"keywords\", []):\n            kw = k.get(\"keyword\", \"\").strip()\n            if kw and not self.db.one(\"SELECT 1 FROM keywords WHERE keyword=?\", (kw,)):\n                self.db.x(\"INSERT INTO keywords(keyword,origin,reason,created_at) VALUES(?,?,?,?)\",\n                          (kw, k.get(\"type\", \"llm\"), k.get(\"reason\", \"\"), time.time()))\n                added += 1\n        self.db.log(f\"키워드 생성: 신규 {added}개\")\n        return added\n\n    # ---------------- 2. 상품 수집 ----------------\n    def _pick_keywords(self, n):\n        rows = self.db.q(\"SELECT * FROM keywords WHERE last_searched_at IS NULL OR last_searched_at<?\",\n                         (time.time() - 3 * 86400,))\n        scored = sorted(rows, key=lambda r: random.betavariate(r[\"alpha\"], r[\"beta\"]), reverse=True)\n        return scored[:n]\n\n    def collect_products(self):\n        n = 0\n        # 골드박스(당일 특가): 하루 2회까지\n        if self.db.calls_since(\"coupang_goldbox\", 43200) == 0:\n            try:\n                for p in self.cp.goldbox():\n                    p[\"score\"] = 0.2\n                    self.db.upsert_product(p); n += 1\n            except CoupangError as e:\n                self.db.log(str(e), \"WARN\")\n        # 니치 관련 베스트 카테고리 1개 순환\n        cats = sorted({c for key, c in NICHE_CAT.items() if key in Config.NICHE}) or [1014]\n        if self.db.calls_since(\"coupang_best\", 6 * 3600) == 0:\n            cat = cats[int(time.time() // 21600) % len(cats)]\n            try:\n                for p in self.cp.best_category(cat):\n                    self.db.upsert_product(p); n += 1\n            except CoupangError as e:\n                self.db.log(str(e), \"WARN\")\n        # 키워드 검색 (시간당 예산 내)\n        budget = self.cp.search_budget_left() if self.cp.live else 3\n        for k in self._pick_keywords(max(0, min(budget, 4))):\n            try:\n                items = self.cp.search(k[\"keyword\"], limit=10)\n            except CoupangError as e:\n                self.db.log(str(e), \"WARN\"); break\n            for p in items:\n                self.db.upsert_product(p); n += 1\n            self.db.x(\"UPDATE keywords SET last_searched_at=? WHERE keyword=?\", (time.time(), k[\"keyword\"]))\n        self.db.log(f\"상품 수집: {n}건 갱신\")\n        return n\n\n    # ---------------- 3. 점수화 & 선택 ----------------\n    def _category_perf(self):\n        rows = self.db.q(\"SELECT category, AVG(reward) r, COUNT(*) c FROM posts WHERE reward IS NOT NULL GROUP BY category\")\n        return {r[\"category\"]: (r[\"r\"], r[\"c\"]) for r in rows}\n\n    def score(self, p, cat_perf):\n        s = 0.0\n        if p.get(\"rank\"):\n            s += max(0, 1 - (p[\"rank\"] - 1) / 20) * 0.3\n        s += 0.15 if p.get(\"is_rocket\") else 0\n        price = p.get(\"price\") or 0\n        # 충동구매가 잘 일어나는 1~5만원대 가중\n        s += 0.25 if 9900 <= price <= 50000 else (0.1 if price <= 150000 else 0)\n        if p.get(\"source\") == \"goldbox\":\n            s += 0.15\n        if p.get(\"keyword\"):\n            k = self.db.one(\"SELECT alpha,beta FROM keywords WHERE keyword=?\", (p[\"keyword\"],))\n            if k:\n                s += 0.3 * k[\"alpha\"] / (k[\"alpha\"] + k[\"beta\"])\n        r, c = cat_perf.get(p.get(\"category\"), (0.5, 0))\n        s += 0.3 * (r if c >= 3 else 0.5)\n        return s\n\n    def pick_product(self):\n        cutoff = time.time() - Config.PRODUCT_COOLDOWN_DAYS * 86400\n        rows = self.db.q(\"\"\"SELECT * FROM products WHERE (last_posted_at IS NULL OR last_posted_at<?)\n                            AND found_at>? ORDER BY found_at DESC LIMIT 300\"\"\",\n                         (cutoff, time.time() - 5 * 86400))\n        if not rows:\n            return None\n        perf = self._category_perf()\n        for r in rows:\n            r[\"score\"] = self.score(r, perf)\n        # 소프트맥스 샘플링 → 상위 위주지만 가끔 새로운 상품도 시도\n        mx = max(r[\"score\"] for r in rows)\n        w = [math.exp((r[\"score\"] - mx) / 0.12) for r in rows]\n        return random.choices(rows, weights=w, k=1)[0]\n\n    # ---------------- API 없을 때: 사람에게 상품 추가 요청 ----------------\n    def available_count(self):\n        cutoff = time.time() - Config.PRODUCT_COOLDOWN_DAYS * 86400\n        return self.db.one(\"\"\"SELECT COUNT(*) c FROM products WHERE (last_posted_at IS NULL OR last_posted_at<?)\n                              AND found_at>?\"\"\", (cutoff, time.time() - 5 * 86400))[\"c\"]\n\n    def suggestions(self, n=10):\n        \"\"\"AI가 찾은 유망 키워드 중 아직 products.csv에 없는 것 → 간편링크 만들 후보\"\"\"\n        have = {r[\"keyword\"] for r in self.db.q(\"SELECT DISTINCT keyword FROM products WHERE keyword IS NOT NULL\")}\n        rows = self.db.q(\"\"\"SELECT keyword, reason, alpha/(alpha+beta) m, created_at FROM keywords\n                            WHERE alpha>0.2 ORDER BY m DESC, created_at DESC LIMIT 60\"\"\")\n        out = [r for r in rows if r[\"keyword\"] not in have][:n]\n        for r in out:\n            r[\"search_url\"] = \"https://www.coupang.com/np/search?q=\" + quote(r[\"keyword\"])\n        return out\n\n    def write_suggestions(self):\n        import csv as _csv\n        from .config import ROOT\n        rows = self.suggestions(15)\n        path = ROOT / \"data\" / \"추천키워드.csv\"\n        with open(path, \"w\", encoding=\"utf-8-sig\", newline=\"\") as f:\n            w = _csv.writer(f)\n            w.writerow([\"keyword\", \"reason\", \"쿠팡검색\", \"→ 마음에 드는 상품의 간편링크를 만들어 products.csv에 추가\"])\n            for r in rows:\n                w.writerow([r[\"keyword\"], r[\"reason\"], r[\"search_url\"], \"\"])\n        return path, rows\n\n    def trend_samples(self, n=12):\n        return [r[\"text\"] for r in self.db.q(\"SELECT text FROM trends WHERE created_at>? ORDER BY RANDOM() LIMIT ?\",\n                                              (time.time() - 3 * 86400, n))]\n", "bot/learner.py": "\"\"\"학습기: 성과 수집 → 보상 계산 → 전략/키워드 업데이트 → LLM 회고로 플레이북 진화\"\"\"\nimport datetime as dt\nimport json\nimport time\n\nfrom . import llm\nfrom .coupang import CoupangError\nfrom .threads import ThreadsError\n\nMATURE_HOURS = 48  # 이 시간이 지난 게시물로 최종 보상 확정\n\n\ndef raw_score(p):\n    return (p[\"views\"] * 0.1 + p[\"likes\"] * 2 + p[\"replies\"] * 4\n            + (p[\"reposts\"] + p[\"quotes\"] + p[\"shares\"]) * 5 + (p.get(\"clicks\") or 0) * 6 + p[\"orders\"] * 150)\n\n\nclass Learner:\n    def __init__(self, db, threads, coupang, strategy):\n        self.db, self.th, self.cp, self.st = db, threads, coupang, strategy\n\n    # ---------- 1. 성과 수집 ----------\n    def collect(self):\n        now = time.time()\n        rows = self.db.q(\"\"\"SELECT * FROM posts WHERE threads_id IS NOT NULL AND post_type!='history' AND posted_at<? AND posted_at>?\n                            AND (metrics_at IS NULL OR metrics_at<?)\"\"\",\n                         (now - 3 * 3600, now - 8 * 86400, now - 5 * 3600))\n        for p in rows:\n            age_h = (now - p[\"posted_at\"]) / 3600\n            try:\n                m = self.th.insights(p[\"threads_id\"], age_hours=age_h, arms=json.loads(p[\"arms\"]))\n            except ThreadsError as e:\n                self.db.log(f\"인사이트 실패 #{p['id']}: {e}\", \"WARN\"); continue\n            self.db.x(\"\"\"UPDATE posts SET views=?,likes=?,replies=?,reposts=?,quotes=?,shares=?,metrics_at=?\n                         WHERE id=?\"\"\", (m[\"views\"], m[\"likes\"], m[\"replies\"], m[\"reposts\"], m[\"quotes\"],\n                                          m[\"shares\"], now, p[\"id\"]))\n        self._attribute_orders()\n        self._attribute_clicks()\n        self.db.log(f\"성과 수집: {len(rows)}개 게시물 갱신\")\n\n    def _attribute_clicks(self):\n        \"\"\"쓰레드 링크 클릭을 링크 URL로 게시물에 귀속 (Meta가 지표를 제공할 때만)\"\"\"\n        clicks = self.th.link_clicks(time.time() - 8 * 86400)\n        for url, n in clicks.items():\n            if not url:\n                continue\n            post = self.db.one(\"\"\"SELECT id FROM posts WHERE post_type='product' AND (reply_text LIKE ? OR text LIKE ?)\n                                  ORDER BY posted_at DESC LIMIT 1\"\"\", (f\"%{url}%\", f\"%{url}%\"))\n            if post:\n                self.db.x(\"UPDATE posts SET clicks=? WHERE id=?\", (n, post[\"id\"]))\n\n    def _attribute_orders(self):\n        if not self.cp.live:\n            return\n        if self.db.calls_since(\"coupang_report\", 6 * 3600) > 0:\n            return\n        end = dt.date.today()\n        start = end - dt.timedelta(days=30)\n        try:\n            orders = self.cp.orders(start.strftime(\"%Y%m%d\"), end.strftime(\"%Y%m%d\"))\n        except CoupangError as e:\n            self.db.log(f\"주문 리포트 실패: {e}\", \"WARN\"); return\n        agg = {}\n        for o in orders:\n            pid = str(o.get(\"productId\"))\n            a = agg.setdefault(pid, [0, 0.0])\n            a[0] += int(o.get(\"quantity\") or 1)\n            a[1] += float(o.get(\"commission\") or 0)\n        for pid, (cnt, com) in agg.items():\n            post = self.db.one(\"SELECT * FROM posts WHERE product_id=? ORDER BY posted_at DESC LIMIT 1\", (pid,))\n            if not post:\n                continue\n            new_orders = cnt - post[\"orders\"]\n            self.db.x(\"UPDATE posts SET orders=?, commission=? WHERE id=?\", (cnt, com, post[\"id\"]))\n            # 이미 학습이 끝난 글에 뒤늦게 주문이 붙으면 추가 보상\n            if new_orders > 0 and post[\"learned\"]:\n                self.st.update(json.loads(post[\"arms\"]), min(1.0, 0.5 * new_orders))\n        # 계정 전체 수익 기록\n        self.db.kv_set(\"revenue_30d\", {\"orders\": sum(a[0] for a in agg.values()),\n                                        \"commission\": sum(a[1] for a in agg.values())})\n\n    # ---------- 2. 보상 확정 & 밴딧 업데이트 ----------\n    def learn(self):\n        now = time.time()\n        matured = self.db.q(\"\"\"SELECT * FROM posts WHERE learned=0 AND metrics_at IS NOT NULL AND posted_at<?\n                               AND post_type!='history'\"\"\", (now - MATURE_HOURS * 3600,))\n        if not matured:\n            return 0\n        hist_by_type = {}\n        for p in matured:\n            s = raw_score(p)\n            # 상품 글과 일반 글은 반응 기준선이 달라 각자 안에서 비교\n            t = p[\"post_type\"] or \"product\"\n            if t not in hist_by_type:\n                hist_by_type[t] = [raw_score(h) for h in self.db.q(\n                    \"SELECT * FROM posts WHERE metrics_at IS NOT NULL AND post_type=? ORDER BY posted_at DESC LIMIT 80\", (t,))]\n            history = hist_by_type[t]\n            # 최근 게시물 대비 백분위 = 보상(0~1). 계정 성장/시즌 변화에 자동 보정됨\n            reward = sum(1 for h in history if h < s) / max(1, len(history))\n            if len(history) < 5:\n                reward = 0.5\n            arms = json.loads(p[\"arms\"])\n            self.st.update(arms, reward)\n            if p[\"keyword\"] and t == \"product\":\n                self.db.x(\"UPDATE keywords SET alpha=alpha+?, beta=beta+?, uses=uses+1 WHERE keyword=?\",\n                          (reward, 1 - reward, p[\"keyword\"]))\n            self.db.x(\"UPDATE posts SET score=?, reward=?, learned=1 WHERE id=?\", (s, reward, p[\"id\"]))\n        self.db.log(f\"학습: {len(matured)}개 게시물 보상 반영\")\n        return len(matured)\n\n    # ---------- 3. LLM 회고 → 플레이북 진화 ----------\n    def reflect(self):\n        posts = self.db.q(\"\"\"SELECT * FROM posts WHERE reward IS NOT NULL AND post_type!='history'\n                             ORDER BY posted_at DESC LIMIT 60\"\"\")\n        hist = self.db.q(\"SELECT * FROM posts WHERE post_type='history' AND views>0 ORDER BY views DESC\")\n        if len(posts) < 4:\n            self.db.log(\"회고: 데이터 부족(게시물 4개 미만) — 건너뜀\")\n            return None\n        posts_sorted = sorted(posts, key=lambda p: p[\"reward\"], reverse=True)\n        fmt = lambda p: (f\"[보상 {p['reward']:.2f} | 조회 {p['views']} 좋아요 {p['likes']} 댓글 {p['replies']} \"\n                         f\"공유 {p['shares'] + p['reposts']} 클릭 {p.get('clicks') or 0} 주문 {p['orders']}] 종류={p['post_type']} 전략={p['arms']} 카테고리={p['category']}\\n\"\n                         f\"{(p['text'] or '')[:300]}\")\n        arms = self.st.table()\n        arm_txt = \"\\n\".join(f\"{a['dimension']}/{a['arm']}: 평균 {a['mean']:.2f}, 시도 {a['pulls']}회\"\n                            f\"{'' if a['active'] else ' (은퇴)'}\" for a in arms)\n        kws = self.db.q(\"SELECT keyword, alpha/(alpha+beta) m, uses FROM keywords WHERE uses>0 ORDER BY m DESC\")\n        cats = self.db.q(\"SELECT category, AVG(reward) r, COUNT(*) c FROM posts WHERE reward IS NOT NULL GROUP BY category ORDER BY r DESC\")\n        trends = self.db.q(\"SELECT text FROM trends WHERE created_at>? ORDER BY RANDOM() LIMIT 15\", (time.time() - 3 * 86400,))\n        prev = self.db.latest_playbook()\n        type_stats = self.db.q(\"\"\"SELECT post_type, COUNT(*) n, AVG(views) v, AVG(likes) l, AVG(replies) r\n                                  FROM posts WHERE metrics_at IS NOT NULL GROUP BY post_type\"\"\")\n        hist_txt = \"\"\n        if hist:\n            hf = lambda p: f\"[조회 {p['views']} 좋아요 {p['likes']} 댓글 {p['replies']}] {(p['text'] or '')[:150]}\"\n            hist_txt = (\"\\n[봇 이전에 내가 직접 쓴 글 — 상위]\\n\" + \"\\n\".join(hf(p) for p in hist[:5])\n                        + \"\\n[직접 쓴 글 — 하위]\\n\" + \"\\n\".join(hf(p) for p in hist[-3:]))\n\n        out = llm.ask_json(\n            \"너는 쓰레드 제휴마케팅 계정의 데이터 분석가이자 전략가다. 데이터에 근거해서만 결론을 내리고, \"\n            \"표본이 적으면 '가설'로 표시한다. 허위 후기·과장광고로 이어지는 전략은 제안하지 않는다.\",\n            f\"\"\"[이전 플레이북]\n{prev or '(없음)'}\n\n[전략 선택지별 성과 (톰슨 샘플링 사후평균)]\n{arm_txt}\n\n[글 종류별 평균] {type_stats}\n(product=상품 광고글, content=광고 없는 일반글. 일반글은 팔로워·도달 확보용이라 상품글과 직접 비교하지 말 것)\n[키워드 성과] {kws[:20]}\n[카테고리 성과] {cats}\n\n[상위 게시물]\n{chr(10).join(fmt(p) for p in posts_sorted[:6])}\n\n[하위 게시물]\n{chr(10).join(fmt(p) for p in posts_sorted[-6:])}\n\n{hist_txt}\n\n[요즘 쓰레드 인기글 샘플 (패턴 참고용, 복제 금지)]\n{chr(10).join('- ' + t['text'][:150].replace(chr(10), ' ') for t in trends) or '(없음)'}\n\n할 일:\n1. 상위/하위 글의 차이를 분석해 '다음 글 작성자'가 바로 적용할 수 있는 플레이북을 새로 써라 (1200자 이내, 불릿).\n   [상품글] [일반글] 섹션을 나눠서.\n   첫 줄 표현, 길이, 구조, 말투, 상품 유형, 피해야 할 것 포함. 확실한 것과 가설을 구분.\n2. 아직 시도 안 해본 새로운 전략 선택지를 0~2개 제안 (dimension은 hook|format|tone|content_type 중 하나).\n3. 성과가 계속 나쁜 키워드가 있으면 은퇴 목록에 넣어라.\n\nJSON: {{\"playbook\":\"...\", \"new_arms\":[{{\"dimension\":\"hook\",\"arm\":\"짧은이름\",\"description\":\"작성 지침\"}}],\n       \"retire_keywords\":[\"...\"], \"summary\":\"오늘 배운 점 한 줄\"}}\"\"\",\n            temperature=0.4, max_tokens=2500,\n        )\n        if out is None:\n            out = self._rule_based_reflection(arms, kws)\n        self.db.x(\"INSERT INTO playbook(created_at,content) VALUES(?,?)\", (time.time(), out.get(\"playbook\", \"\")))\n        for a in out.get(\"new_arms\", [])[:2]:\n            if self.st.add_arm(a.get(\"dimension\"), a.get(\"arm\", \"\").strip()[:30], a.get(\"description\", \"\")):\n                self.db.log(f\"새 전략 추가: {a['dimension']}/{a['arm']}\")\n        for k in out.get(\"retire_keywords\", []):\n            self.db.x(\"UPDATE keywords SET alpha=0.1, last_searched_at=? WHERE keyword=?\", (time.time() + 30 * 86400, k))\n        self.db.log(f\"회고 완료: {out.get('summary', '')}\")\n        return out\n\n    @staticmethod\n    def _rule_based_reflection(arms, kws):\n        best = {}\n        for a in arms:\n            if a[\"active\"] and (a[\"dimension\"] not in best or a[\"mean\"] > best[a[\"dimension\"]][\"mean\"]):\n                best[a[\"dimension\"]] = a\n        names = {\"hook\": \"첫 문장 스타일\", \"format\": \"글 형식\", \"tone\": \"말투\", \"link_placement\": \"링크 위치\",\n                 \"time_slot\": \"올리는 시간\", \"content_type\": \"일반 글 유형\"}\n        lines = [f\"- {names.get(d, d)}: 지금까지는 '{a['arm']}'이 가장 반응이 좋아요 ({a['pulls']}회 시도)\"\n                 for d, a in best.items()]\n        if kws:\n            lines.append(f\"- 반응 좋은 키워드: {', '.join(k['keyword'] for k in kws[:5])}\")\n        return {\"playbook\": \"\\n\".join(lines), \"new_arms\": [], \"retire_keywords\": [],\n                \"summary\": \"규칙 기반 요약 (LLM 키 없음)\"}\n\n\ndef import_history(db, threads, limit=100):\n    \"\"\"봇 이전에 직접 올린 글과 성과를 가져와 회고의 참고자료로 사용 (전략 학습엔 미반영)\"\"\"\n    items = threads.my_threads(limit)\n    n = 0\n    for it in items:\n        if not it.get(\"text\") or db.one(\"SELECT 1 FROM posts WHERE threads_id=?\", (it[\"id\"],)):\n            continue\n        try:\n            m = threads.insights(it[\"id\"])\n        except Exception:\n            continue\n        ts = dt.datetime.strptime(it[\"timestamp\"][:19], \"%Y-%m-%dT%H:%M:%S\").replace(tzinfo=dt.timezone.utc).timestamp()\n        db.x(\"\"\"INSERT INTO posts(threads_id,permalink,arms,text,posted_at,post_type,views,likes,replies,reposts,quotes,\n                shares,metrics_at,learned) VALUES(?,?,?,?,?,'history',?,?,?,?,?,?,?,1)\"\"\",\n             (it[\"id\"], it.get(\"permalink\"), \"{}\", it[\"text\"][:1000], ts, m[\"views\"], m[\"likes\"], m[\"replies\"],\n              m[\"reposts\"], m[\"quotes\"], m[\"shares\"], time.time()))\n        n += 1\n    db.log(f\"기존 글 {n}개 가져옴 (회고 참고용)\")\n    return n\n", "bot/llm.py": "\"\"\"Claude API 래퍼. 키가 없으면 None을 돌려주고 호출부에서 규칙 기반 대체 로직을 사용한다.\"\"\"\nimport json\nimport re\n\nimport requests\n\nfrom .config import Config\n\n\ndef ask(system, user, max_tokens=1500, temperature=0.8):\n    if not Config.has_llm():\n        return None\n    r = requests.post(\n        \"https://api.anthropic.com/v1/messages\",\n        headers={\"x-api-key\": Config.ANTHROPIC_API_KEY, \"anthropic-version\": \"2023-06-01\",\n                 \"content-type\": \"application/json\"},\n        json={\"model\": Config.LLM_MODEL, \"max_tokens\": max_tokens, \"temperature\": temperature,\n              \"system\": system, \"messages\": [{\"role\": \"user\", \"content\": user}]},\n        timeout=120,\n    )\n    if r.status_code >= 400:\n        raise RuntimeError(f\"LLM 오류 {r.status_code}: {r.text[:300]}\")\n    return \"\".join(b.get(\"text\", \"\") for b in r.json().get(\"content\", []))\n\n\ndef ask_json(system, user, **kw):\n    txt = ask(system + \"\\n\\n반드시 JSON만 출력하세요. 설명이나 코드블록 표시 없이.\", user, **kw)\n    if txt is None:\n        return None\n    m = re.search(r\"(\\{.*\\}|\\[.*\\])\", txt, re.S)\n    if not m:\n        raise RuntimeError(f\"LLM JSON 파싱 실패: {txt[:200]}\")\n    return json.loads(m.group(1))\n", "bot/notify.py": "\"\"\"알림: 외부 메신저 없이 data/알림.txt 에 쌓고 리포트 상단에 표시\"\"\"\nimport datetime as dt\nfrom zoneinfo import ZoneInfo\n\nfrom .config import ROOT, Config\n\nPATH = ROOT / \"data\" / \"알림.txt\"\n\n\ndef send(text):\n    PATH.parent.mkdir(parents=True, exist_ok=True)\n    with open(PATH, \"a\", encoding=\"utf-8\") as f:\n        f.write(f\"\\n===== {dt.datetime.now(ZoneInfo(Config.TIMEZONE)):%Y-%m-%d %H:%M} =====\\n{text}\\n\")\n    body = PATH.read_text(encoding=\"utf-8\")\n    if len(body) > 30000:  # 파일이 끝없이 커지지 않게 최근 것만 유지\n        PATH.write_text(body[-20000:], encoding=\"utf-8\")\n    return True\n\n\ndef recent(n_chars=3000):\n    if not PATH.exists():\n        return \"\"\n    return PATH.read_text(encoding=\"utf-8\")[-n_chars:]\n", "bot/replier.py": "\"\"\"댓글 자동 답글: 대화가 오가는 글을 쓰레드가 더 멀리 퍼뜨리므로 댓글에 자연스럽게 답한다.\"\"\"\nimport time\n\nfrom . import llm\nfrom .config import Config\nfrom .threads import ThreadsError\n\nSYSTEM = \"\"\"너는 쓰레드 생활 큐레이터 계정 운영자로서 내 글에 달린 댓글에 답한다.\n페르소나: {persona}\n원칙:\n- 1~2문장, 사람처럼 짧고 자연스럽게. 댓글 말투(반말/존댓말)에 맞춘다.\n- 새 링크를 달지 않는다. 구매 강요 금지. 가격/구매처를 물으면 '고정 댓글(첫 댓글)에 링크 있어요' 정도로만.\n- 광고냐고 물으면 솔직하게 쿠팡 파트너스 제휴 링크라 수수료를 받을 수 있다고 답한다.\n- 써봤냐고 물으면 직접 써본 척하지 말고, 정보를 모아 정리한 거라고 솔직하게 말한다.\n- 스팸·홍보·욕설·정치·의미 없는 댓글이면 답하지 않는다(skip).\n출력 JSON: {{\"reply\": \"답글 또는 빈 문자열\", \"skip_reason\": \"답 안 하는 이유(답하면 빈 문자열)\"}}\"\"\"\n\n\nclass Replier:\n    def __init__(self, db, threads):\n        self.db, self.th = db, threads\n        self._me = None\n\n    def run(self):\n        if not Config.AUTO_REPLY or self.th.sim or not Config.has_llm():\n            return 0\n        left = Config.REPLIES_PER_DAY - self.db.one(\n            \"SELECT COUNT(*) c FROM replied WHERE at>? AND reply IS NOT NULL\", (time.time() - 86400,))[\"c\"]\n        if left <= 0:\n            return 0\n        if self._me is None:\n            self._me = self.th.me().get(\"username\")\n        posts = self.db.q(\"\"\"SELECT * FROM posts WHERE threads_id IS NOT NULL AND post_type!='history'\n                             AND posted_at>? ORDER BY posted_at DESC\"\"\", (time.time() - 3 * 86400,))\n        sent = 0\n        for p in posts:\n            per_post = self.db.one(\"SELECT COUNT(*) c FROM replied WHERE post_id=? AND reply IS NOT NULL\", (p[\"id\"],))[\"c\"]\n            for c in self.th.get_replies(p[\"threads_id\"]):\n                if sent >= left or per_post >= 6:\n                    break\n                if c.get(\"username\") == self._me or not c.get(\"text\") or c.get(\"hide_status\") not in (None, \"NOT_HUSHED\", \"UNHUSHED\"):\n                    continue\n                if self.db.one(\"SELECT 1 FROM replied WHERE comment_id=?\", (c[\"id\"],)):\n                    continue\n                out = llm.ask_json(SYSTEM.format(persona=Config.PERSONA),\n                                   f\"[내 글]\\n{(p['text'] or '')[:400]}\\n\\n[글 종류] {'상품 소개(링크는 첫 댓글)' if p['post_type']=='product' else '일반 글(링크 없음)'}\"\n                                   f\"\\n\\n[댓글 @{c.get('username')}]\\n{c['text'][:300]}\", temperature=0.7, max_tokens=300)\n                reply = (out or {}).get(\"reply\", \"\").strip()\n                if reply and \"http\" not in reply:\n                    try:\n                        self.th.post(reply[:300], reply_to=c[\"id\"])\n                        sent += 1; per_post += 1\n                        time.sleep(20)\n                    except ThreadsError as e:\n                        self.db.log(f\"답글 실패: {e}\", \"WARN\"); reply = None\n                else:\n                    reply = None\n                self.db.x(\"INSERT OR IGNORE INTO replied VALUES(?,?,?,?,?)\",\n                          (c[\"id\"], p[\"id\"], time.time(), c[\"text\"][:300], reply))\n        if sent:\n            self.db.log(f\"댓글 답글 {sent}개 작성\")\n        return sent\n", "bot/report.py": "\"\"\"성과 리포트 HTML 생성 (data/report.html)\"\"\"\nimport datetime as dt\nimport html\nimport json\n\nfrom .config import ROOT\n\n\ndef build(engine):\n    db, st = engine.db, engine.st\n    posts = db.q(\"SELECT * FROM posts WHERE post_type!='history' ORDER BY posted_at DESC LIMIT 50\")\n    tot = db.one(\"\"\"SELECT COUNT(*) n, SUM(views) v, SUM(likes) l, SUM(replies) r, SUM(orders) o, SUM(commission) c\n                    FROM posts WHERE post_type!='history'\"\"\")\n    rev = db.kv_get(\"revenue_30d\", {})\n    arms = st.table()\n    kws = db.q(\"SELECT keyword, origin, reason, alpha/(alpha+beta) m, uses FROM keywords ORDER BY m DESC, uses DESC LIMIT 30\")\n    pb = db.latest_playbook() or \"아직 회고 전\"\n    e = lambda s: html.escape(str(s if s is not None else \"\"))\n\n    rw = lambda r: '' if r is None else f\"{r:.2f}\"\n\n    def bar(v):\n        return f'<div class=\"bar\"><span style=\"width:{v*100:.0f}%\"><\/span><\/div> {v:.2f}'\n\n    dims = {}\n    for a in arms:\n        dims.setdefault(a[\"dimension\"], []).append(a)\n    arm_html = \"\".join(\n        f\"<h3>{e(d)}<\/h3><table>\" + \"\".join(\n            f\"<tr class='{'' if a['active'] else 'off'}'><td>{e(a['arm'])}{' 🆕' if a['origin']=='llm' else ''}<\/td>\"\n            f\"<td>{bar(a['mean'])}<\/td><td>{a['pulls']}회<\/td><\/tr>\" for a in lst) + \"<\/table>\"\n        for d, lst in dims.items())\n    post_html = \"\".join(\n        f\"<tr><td>{dt.datetime.fromtimestamp(p['posted_at']):%m/%d %H:%M}<\/td>\"\n        f\"<td><a href='{e(p['permalink'])}'>{e((p['text'] or '')[:60])}…<\/a><\/td>\"\n        f\"<td>{p['views']}<\/td><td>{p['likes']}<\/td><td>{p['replies']}<\/td><td>{p['orders']}<\/td>\"\n        f\"<td>{rw(p['reward'])}<\/td>\"\n        f\"<td class='small'>{e(', '.join(json.loads(p['arms']).values()))}<\/td><\/tr>\" for p in posts)\n    kw_html = \"\".join(f\"<tr><td>{e(k['keyword'])}<\/td><td>{k['m']:.2f}<\/td><td>{k['uses']}<\/td>\"\n                      f\"<td class='small'>{e(k['reason'])}<\/td><\/tr>\" for k in kws)\n\n    page = f\"\"\"<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>쓰레드 자동화 리포트<\/title>\n<style>\n:root{{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--card:#fff;--line:#e7e5e4;--acc:#0f766e}}\n@media(prefers-color-scheme:dark){{:root{{--bg:#0c0a09;--fg:#f5f5f4;--mut:#a8a29e;--card:#1c1917;--line:#292524;--acc:#2dd4bf}}}}\nbody{{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,'Pretendard',sans-serif;margin:0;padding:16px;max-width:1000px;margin:auto}}\n.kpi{{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}}\n.kpi div{{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}}\n.kpi b{{display:block;font-size:22px}} .kpi small{{color:var(--mut)}}\nsection{{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;overflow-x:auto}}\ntable{{width:100%;border-collapse:collapse}} td,th{{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}}\n.bar{{display:inline-block;width:90px;height:8px;background:var(--line);border-radius:4px;vertical-align:middle}}\n.bar span{{display:block;height:100%;background:var(--acc);border-radius:4px}}\n.off{{opacity:.4}} .small{{font-size:12px;color:var(--mut)}} pre{{white-space:pre-wrap}} a{{color:var(--acc)}}\n<\/style><\/head><body>\n<h1>쓰레드 × 쿠팡파트너스 자동화<\/h1>\n<p class=\"small\">생성: {dt.datetime.now():%Y-%m-%d %H:%M} · {'시뮬레이션' if engine.th.sim else '실제'} 모드<\/p>\n<div class=\"kpi\">\n<div><small>게시물<\/small><b>{tot['n'] or 0}<\/b><\/div><div><small>총 조회<\/small><b>{tot['v'] or 0:,}<\/b><\/div>\n<div><small>좋아요<\/small><b>{tot['l'] or 0:,}<\/b><\/div><div><small>댓글<\/small><b>{tot['r'] or 0:,}<\/b><\/div>\n<div><small>30일 주문<\/small><b>{rev.get('orders', 0)}<\/b><\/div><div><small>30일 수수료<\/small><b>{rev.get('commission', 0):,.0f}원<\/b><\/div>\n<\/div>\n<section><h2>알림 · 일일 요약<\/h2><pre>{e(__import__(\"bot.notify\", fromlist=[\"recent\"]).recent())}<\/pre><\/section>\n<section><h2>현재 플레이북 (AI가 데이터로 학습)<\/h2><pre>{e(pb)}<\/pre><\/section>\n<section><h2>전략별 학습 현황<\/h2><p class=\"small\">막대 = 기대 성과(0~1). 높을수록 더 자주 선택됨. 🆕 = AI가 새로 만든 전략<\/p>{arm_html}<\/section>\n<section><h2>키워드 성과<\/h2><tabl
